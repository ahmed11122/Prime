<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — إدارة عملاء المبيعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#155dfc; --blue-deep:#0b3fb3; --blue-pale:#eaf1ff; --ink:#0f1b3d;
  --line:#dde5f4; --muted:#6b7695; --white:#ffffff; --bg:#f6f8fd;
  --st-new:#94a3b8; --st-contacted:#0ea5e9; --st-interested:#155dfc; --st-active:#16a34a; --st-rejected:#e11d48;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif; background:var(--bg); color:var(--ink);}

/* ── Header ────────────────────────────────────────── */
header{
  background:var(--white); border-bottom:1px solid var(--line);
  padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  position:sticky; top:0; z-index:100;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{
  width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:1.1rem;
}
.brand h1{font-size:1.05rem; font-weight:900; color:var(--ink);}
.brand .tag{font-size:0.72rem; color:var(--muted); font-weight:600;}
.head-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.chip{
  background:var(--blue-pale); color:var(--blue-deep); border:none; padding:8px 14px; border-radius:20px;
  font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:5px;
}
.chip:hover{background:#dce9ff;}
.chip.danger{background:#fde8ec; color:#e11d48;}
.chip.danger:hover{background:#fbd4dc;}
.who-badge{font-size:0.78rem; color:var(--muted); font-weight:600;}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:4px;}
.dot.ok{background:#16a34a;} .dot.err{background:#e11d48;}

/* ── Stat strip ────────────────────────────────────── */
.stats{display:flex; gap:14px; padding:16px 22px 0; flex-wrap:wrap;}
.stat-card{
  background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px 18px;
  flex:1; min-width:120px;
}
.stat-card .n{font-size:1.5rem; font-weight:900; color:var(--blue-deep);}
.stat-card .l{font-size:0.76rem; color:var(--muted); font-weight:600; margin-top:2px;}

.wrap{max-width:1180px; margin:0 auto; padding:18px 22px 40px;}

.notice{
  background:var(--blue-pale); border-radius:12px; padding:13px 16px; font-size:0.83rem;
  color:var(--blue-deep); margin-bottom:18px; line-height:1.7; font-weight:500;
}

/* ── Add form ──────────────────────────────────────── */
.add-panel{background:var(--white); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px;}
.add-panel .hd{font-size:0.92rem; font-weight:800; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:6px;}
.add-grid{display:grid; grid-template-columns:1.2fr 1fr 1fr auto; gap:10px;}
.add-grid input{padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:0.87rem;}
.add-grid input:focus{outline:none; border-color:var(--blue);}
.btn-add{background:var(--blue); color:#fff; border:none; border-radius:10px; padding:11px 22px; font-weight:800; font-family:inherit; cursor:pointer; white-space:nowrap;}
.btn-add:hover{background:var(--blue-deep);}

/* ── Toolbar ───────────────────────────────────────── */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
.search-box{flex:2; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px;}
.search-box input{border:none; outline:none; flex:1; font-family:inherit; font-size:0.87rem;}
.select-pill{background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; font-size:0.85rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--ink);}
.tabgroup{display:flex; gap:6px; background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:4px;}
.tabgroup button{border:none; background:transparent; padding:8px 14px; border-radius:7px; font-family:inherit; font-size:0.83rem; font-weight:700; color:var(--muted); cursor:pointer;}
.tabgroup button.active{background:var(--blue); color:#fff;}
.export-btns{display:flex; gap:8px;}
.btn-ghost{background:var(--white); border:1.5px solid var(--line); color:var(--ink); padding:9px 16px; border-radius:10px; font-weight:700; font-family:inherit; cursor:pointer; font-size:0.82rem;}
.btn-ghost:hover{border-color:var(--blue); color:var(--blue);}

/* ── Kanban board ──────────────────────────────────── */
.board{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px;}
.col{background:var(--white); border-radius:16px; border:1px solid var(--line); padding:12px; min-height:200px; min-width:0;}
.col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:2px 4px;}
.col-head .title{font-size:0.85rem; font-weight:800; display:flex; align-items:center; gap:6px;}
.col-head .count{background:var(--bg); color:var(--muted); font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:12px;}
.stage-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.lead-card{
  background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:9px;
  cursor:pointer; transition:all .12s;
}
.lead-card:hover{border-color:var(--blue); box-shadow:0 3px 10px rgba(21,93,252,0.1); transform:translateY(-1px);}
.lead-card .nm{font-size:0.88rem; font-weight:800; margin-bottom:3px;}
.lead-card .ph{font-size:0.76rem; color:var(--muted); direction:ltr; text-align:right;}
.lead-card .meta{display:flex; justify-content:space-between; margin-top:7px; font-size:0.7rem; color:var(--muted);}
.reminder-flag{color:#e11d48; font-weight:700;}
.col-empty{text-align:center; color:var(--muted); font-size:0.78rem; padding:24px 6px;}

/* ── Sheets & modal ────────────────────────────────── */
.sheet-bg, .modal-bg{position:fixed; inset:0; background:rgba(15,27,61,0.5); display:none; align-items:center; justify-content:center; z-index:9999; padding:16px;}
.sheet-bg.show, .modal-bg.show{display:flex;}
.sheet{background:var(--white); border-radius:16px; width:100%; max-width:340px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.2);}
.sheet-item{padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); cursor:pointer; font-size:0.88rem; font-weight:600;}
.sheet-item:hover{background:var(--blue-pale);}
.radio{width:18px; height:18px; border-radius:50%; border:2px solid #c3cee6;}
.radio.checked{border-color:var(--blue); background:radial-gradient(circle,var(--blue) 40%,transparent 42%);}

.modal{background:var(--white); border-radius:18px; padding:22px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; position:relative;}
.modal h3{color:var(--ink); font-size:1.05rem; font-weight:900; margin-bottom:4px;}
.modal .sub{font-size:0.81rem; color:var(--muted); margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:0.78rem; font-weight:700; color:var(--muted); margin-bottom:4px;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:0.86rem;}
.field textarea{min-height:60px; resize:vertical;}
.modal-close{position:absolute; top:14px; left:14px; background:var(--bg); border:none; width:28px; height:28px; border-radius:50%; font-size:1rem; cursor:pointer; color:var(--muted);}
.modal-actions{display:flex; gap:8px; margin-top:14px;}
.tl{margin-top:16px; border-top:1px solid var(--line); padding-top:12px;}
.tl h4{font-size:0.8rem; color:var(--muted); margin-bottom:8px; font-weight:700;}
.tl-item{background:var(--bg); border-radius:9px; padding:9px 11px; font-size:0.79rem; margin-bottom:6px;}
.tl-time{color:var(--muted); font-size:0.69rem; margin-top:2px;}

footer{text-align:center; padding:22px; font-size:0.76rem; color:var(--muted);}

/* ── Desktop / wide screens: let columns breathe instead of stretching edge to edge ── */
@media (min-width:1300px){
  .wrap{max-width:1360px;}
  .board{grid-template-columns:repeat(5,1fr); gap:16px;}
}

/* ── Tablet: 2 columns per row, board wraps instead of scrolling ── */
@media (max-width:900px){
  .board{grid-template-columns:1fr 1fr;}
  .add-grid{grid-template-columns:1fr 1fr;}
}

/* ── Phone: horizontal scroll-snap board, stacked toolbar/header ── */
@media (max-width:640px){
  header{padding:12px 14px;}
  .head-actions{width:100%; justify-content:space-between;}
  .stats{padding:12px 14px 0;}
  .stat-card{min-width:44%;}
  .wrap{padding:14px 14px 32px;}
  .add-grid{grid-template-columns:1fr;}
  .toolbar{flex-direction:column; align-items:stretch;}
  .toolbar > *{width:100%;}
  .export-btns{display:grid; grid-template-columns:1fr 1fr;}
  .board{
    display:flex; grid-template-columns:none; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:6px; margin:0 -14px; padding-inline:14px;
  }
  .col{flex:0 0 82vw; scroll-snap-align:start;}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">م</div>
    <div>
      <h1>مسار</h1>
      <div class="tag">إدارة رحلة العميل — قسم المبيعات</div>
    </div>
  </div>
  <div class="head-actions">
    <span class="who-badge"><span class="dot ok" id="connDot"></span><span id="connText">متصل</span></span>
    <button class="chip" id="whoChip" onclick="openUsersInfo()">👤 —</button>
    <button class="chip danger" onclick="doLogout()">خروج</button>
  </div>
</header>

<div class="stats">
  <div class="stat-card"><div class="n" id="statTotal">0</div><div class="l">إجمالي العملاء</div></div>
  <div class="stat-card"><div class="n" id="statMine">0</div><div class="l">عملائي الحاليين</div></div>
  <div class="stat-card"><div class="n" id="statActive">0</div><div class="l">عملاء نشطين</div></div>
  <div class="stat-card"><div class="n" id="statReminders">0</div><div class="l">تذكيرات اليوم</div></div>
</div>

<div class="wrap">
  <div class="notice" id="roleNotice">جاري تحميل بيانات الحساب...</div>

  <div class="add-panel">
    <div class="hd">➕ إضافة عميل جديد</div>
    <div class="add-grid">
      <input type="text" id="cName" placeholder="اسم العميل / الشركة">
      <input type="text" id="cPhone" placeholder="رقم الهاتف" dir="ltr">
      <input type="text" id="cAddress" placeholder="العنوان / المنطقة">
      <button class="btn-add" onclick="saveClient()">إضافة</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabgroup">
      <button id="tabMine" class="active" onclick="switchTab('mine')">عملائي</button>
      <button id="tabAll" onclick="switchTab('all')">الكل</button>
      <button id="tabReminders" onclick="switchTab('reminders')">تذكيرات اليوم</button>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchBox" placeholder="بحث بالاسم أو الهاتف..." oninput="renderBoard()">
    </div>
    <div class="select-pill" onclick="openLocSheet()">📍 <span id="locFilterLabel">كل المناطق</span></div>
    <div class="export-btns">
      <button class="btn-ghost" onclick="exportExcel()">⬇ Excel</button>
      <button class="btn-ghost" onclick="exportPDF()">🖨 PDF</button>
    </div>
  </div>

  <div class="board" id="board"></div>
</div>

<footer>© 2026 — نظام مسار لإدارة عملاء المبيعات</footer>

<div class="sheet-bg" id="locSheetBg" onclick="if(event.target===this)closeSheet('locSheetBg')">
  <div class="sheet" id="locSheetList"></div>
</div>

<div class="modal-bg" id="detailModalBg">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('detailModalBg')">✕</button>
    <h3 id="detailName">—</h3>
    <div class="sub" id="detailMeta"></div>

    <div class="field">
      <label>المرحلة</label>
      <select id="detailStageSelect">
        <option value="new">جديد</option>
        <option value="contacted">تم التواصل</option>
        <option value="interested">مهتم</option>
        <option value="active">عميل فعلي</option>
        <option value="rejected">مرفوض</option>
      </select>
    </div>
    <div class="field">
      <label>ملاحظة</label>
      <textarea id="detailNote" placeholder="ملاحظة عن آخر تواصل..."></textarea>
    </div>
    <div class="field">
      <label>تذكير متابعة (اختياري)</label>
      <input type="date" id="detailReminder">
    </div>
    <div class="field" id="transferField">
      <label>نقل إلى موظف آخر</label>
      <select id="transferTo"><option value="">— بدون نقل —</option></select>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" onclick="deleteClient()" style="border-color:#e11d48; color:#e11d48;">حذف</button>
      <button class="btn-add" style="flex:1;" onclick="saveClientUpdate()">حفظ التحديث</button>
    </div>

    <div class="tl">
      <h4>سجل المتابعة</h4>
      <div id="timelineList"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA1q9LiS6EXNCBFmFvytyN-p4KKgP9wym4",
  authDomain: "prime-e-8eb80.firebaseapp.com",
  databaseURL: "https://prime-e-8eb80-default-rtdb.firebaseio.com",
  projectId: "prime-e-8eb80",
  storageBucket: "prime-e-8eb80.firebasestorage.app",
  messagingSenderId: "671376930301",
  appId: "1:671376930301:web:f8b61666314f3149fb5594"
};
firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();
const fbAuth = firebase.auth();

let myWorkspaceOwner=null, myUid=null, isAdmin=false, myDisplayName='';
let staffDirectory={}; let allClients={};
let currentTab='mine'; let locFilter='all';

const STAGES = ['new','contacted','interested','active','rejected'];
const STAGE_LABELS = { new:'جديد', contacted:'تم التواصل', interested:'مهتم', active:'عميل فعلي', rejected:'مرفوض' };
const STAGE_COLORS = { new:'var(--st-new)', contacted:'var(--st-contacted)', interested:'var(--st-interested)', active:'var(--st-active)', rejected:'var(--st-rejected)' };

fbAuth.onAuthStateChanged(function(user){
  if(!user){ document.getElementById('roleNotice').textContent='الرجاء تسجيل الدخول من الملف الرئيسي أولاً'; return; }
  myUid = user.uid;
  fbDB.ref('admins/'+user.uid).once('value').then(adminSnap=>{
    if(adminSnap.val()===true){ isAdmin=true; myWorkspaceOwner=user.uid; boot(); }
    else{
      fbDB.ref('memberIndex/'+user.uid).once('value').then(idxSnap=>{
        const owner = idxSnap.val();
        if(owner){ myWorkspaceOwner=owner; boot(); }
        else document.getElementById('roleNotice').textContent='حساب غير مرتبط بمساحة عمل';
      });
    }
  }).catch(()=>{ setConn(false); });
});

function setConn(ok){
  document.getElementById('connDot').className = 'dot ' + (ok?'ok':'err');
  document.getElementById('connText').textContent = ok ? 'متصل' : 'خطأ اتصال';
}

function boot(){
  myDisplayName = (fbAuth.currentUser && fbAuth.currentUser.displayName) || (fbAuth.currentUser && fbAuth.currentUser.email) || 'موظف';
  document.getElementById('whoChip').innerHTML = '👤 ' + escapeHtml(myDisplayName) + (isAdmin?' <span style="opacity:.65">— مشرف</span>':' <span style="opacity:.65">— مبيعات</span>');
  document.getElementById('roleNotice').textContent = isAdmin
    ? 'حسابك بصلاحية "مسؤول" — ترى كل العملاء وتقدر تدير المستخدمين.'
    : 'حسابك بصلاحية "عضو" — تقدر تضيف عملاء وتغيّر المرحلة وتضيف ملاحظات وتذكيرات، وتنقل العميل لزميل. تعديل البيانات الأساسية والحذف وإدارة المستخدمين للمسؤول فقط.';
  loadStaffDirectory();
  listenClients();
}

function doLogout(){ fbAuth.signOut(); }
function openUsersInfo(){
  const role = isAdmin ? 'مشرف (صاحب مساحة العمل)' : 'موظف مبيعات';
  alert('الاسم: ' + myDisplayName + '\nالصلاحية: ' + role + (isAdmin ? '' : '\nمعرّف مساحة العمل: ' + myWorkspaceOwner));
}

function loadStaffDirectory(){
  fbDB.ref('staffMembers/'+myWorkspaceOwner).once('value').then(snap=>{
    staffDirectory={};
    snap.forEach(child=>{ staffDirectory[child.key] = (child.val()&&child.val().name)||child.key; });
    const sel=document.getElementById('transferTo');
    sel.innerHTML='<option value="">— بدون نقل —</option>';
    Object.keys(staffDirectory).forEach(uid=>{
      const opt=document.createElement('option'); opt.value=uid; opt.textContent=staffDirectory[uid]; sel.appendChild(opt);
    });
  });
}

function clientsRef(){ return fbDB.ref('users/'+myWorkspaceOwner+'/crm/clients'); }

function listenClients(){
  clientsRef().on('value', snap=>{
    allClients = snap.val() || {};
    setConn(true);
    renderBoard();
  }, err=>{ setConn(false); });
}

function isDueToday(c){
  if(!c.reminder) return false;
  return c.reminder <= new Date().toISOString().slice(0,10);
}

function switchTab(tab){
  currentTab = tab;
  ['tabMine','tabAll','tabReminders'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  renderBoard();
}

function getFilteredEntries(){
  let entries = Object.entries(allClients);
  if(currentTab==='mine' || (!isAdmin && currentTab==='all')) entries = entries.filter(([id,c])=>c.assignedTo===myUid);
  if(currentTab==='reminders') entries = entries.filter(([id,c])=>c.assignedTo===myUid && isDueToday(c));
  if(locFilter!=='all') entries = entries.filter(([id,c])=>(c.address||'').includes(locFilter));
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  if(search) entries = entries.filter(([id,c])=>(c.name||'').toLowerCase().includes(search)||(c.phone||'').includes(search));
  entries.sort((a,b)=>(b[1].lastUpdated||0)-(a[1].lastUpdated||0));
  return entries;
}

function renderBoard(){
  const entries = getFilteredEntries();
  const all = Object.values(allClients);
  document.getElementById('statTotal').textContent = all.length;
  document.getElementById('statMine').textContent = all.filter(c=>c.assignedTo===myUid).length;
  document.getElementById('statActive').textContent = all.filter(c=>c.stage==='active').length;
  document.getElementById('statReminders').textContent = all.filter(c=>c.assignedTo===myUid && isDueToday(c)).length;

  const board = document.getElementById('board');
  board.innerHTML = STAGES.map(stage=>{
    const items = entries.filter(([id,c])=>c.stage===stage);
    return `
      <div class="col">
        <div class="col-head">
          <span class="title"><span class="stage-dot" style="background:${STAGE_COLORS[stage]}"></span>${STAGE_LABELS[stage]}</span>
          <span class="count">${items.length}</span>
        </div>
        ${items.length ? items.map(([id,c])=>`
          <div class="lead-card" onclick="openDetail('${id}')">
            <div class="nm">${escapeHtml(c.name||'')}</div>
            <div class="ph">${escapeHtml(c.phone||'')}</div>
            <div class="meta">
              <span>${escapeHtml(staffDirectory[c.assignedTo]||'—')}</span>
              <span class="${isDueToday(c)?'reminder-flag':''}">${isDueToday(c)?'🔔 متابعة اليوم':''}</span>
            </div>
          </div>`).join('') : '<div class="col-empty">لا يوجد عملاء</div>'}
      </div>`;
  }).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function openLocSheet(){
  const addresses = ['all', ...new Set(Object.values(allClients).map(c=>c.address).filter(Boolean))];
  document.getElementById('locSheetList').innerHTML = addresses.map(a=>`
    <div class="sheet-item" onclick="setLocFilter('${a==='all'?'all':escapeHtml(a).replace(/'/g,"\\'")}')">
      <span>${a==='all'?'كل المناطق':escapeHtml(a)}</span>
      <span class="radio ${locFilter===a?'checked':''}"></span>
    </div>`).join('');
  document.getElementById('locSheetBg').classList.add('show');
}
function setLocFilter(v){ locFilter=v; document.getElementById('locFilterLabel').textContent = v==='all'?'كل المناطق':v; closeSheet('locSheetBg'); renderBoard(); }
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function saveClient(){
  const name=document.getElementById('cName').value.trim();
  const phone=document.getElementById('cPhone').value.trim();
  const address=document.getElementById('cAddress').value.trim();
  if(!name||!phone){ alert('الرجاء إدخال الاسم ورقم الهاتف'); return; }
  const now=Date.now();
  const client={ name, phone, address, stage:'new', assignedTo:myUid, createdAt:now, lastUpdated:now,
    history:{ [now]:{ fromUid:null, toUid:myUid, stage:'new', note:'تم إنشاء العميل', timestamp:now } } };
  clientsRef().push().set(client).then(()=>{
    document.getElementById('cName').value=''; document.getElementById('cPhone').value=''; document.getElementById('cAddress').value='';
  }).catch(err=>alert('فشل الحفظ: '+err.message));
}

function exportExcel(){
  const entries = getFilteredEntries();
  const rows = entries.map(([id,c])=>({ الاسم:c.name, الهاتف:c.phone, العنوان:c.address||'', المرحلة:STAGE_LABELS[c.stage]||c.stage, المسؤول:staffDirectory[c.assignedTo]||'' }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'العملاء');
  XLSX.writeFile(wb, 'masar-export.xlsx');
}
function exportPDF(){ window.print(); }

let activeClientId=null;
function openDetail(id){
  activeClientId=id;
  const c=allClients[id]; if(!c) return;
  document.getElementById('detailName').textContent=c.name;
  document.getElementById('detailMeta').textContent=(c.phone||'')+(c.address?' — '+c.address:'')+' — المسؤول: '+(staffDirectory[c.assignedTo]||'—');
  document.getElementById('detailStageSelect').value=c.stage;
  document.getElementById('detailNote').value='';
  document.getElementById('detailReminder').value=c.reminder||'';
  document.getElementById('transferTo').value='';

  const hist = c.history ? Object.values(c.history).sort((a,b)=>b.timestamp-a.timestamp) : [];
  document.getElementById('timelineList').innerHTML = hist.length ? hist.map(h=>`
    <div class="tl-item">
      ${h.fromUid ? 'انتقل من '+escapeHtml(staffDirectory[h.fromUid]||'—')+' إلى '+escapeHtml(staffDirectory[h.toUid]||'—') : 'تم إنشاء العميل'}
      ${h.stage ? ' — '+(STAGE_LABELS[h.stage]||h.stage) : ''}
      ${h.note ? '<br>'+escapeHtml(h.note) : ''}
      <div class="tl-time">${new Date(h.timestamp).toLocaleString('ar-EG')}</div>
    </div>`).join('') : '<div style="color:var(--muted); font-size:0.78rem;">لا يوجد سجل بعد</div>';

  document.getElementById('detailModalBg').classList.add('show');
}

function saveClientUpdate(){
  const c=allClients[activeClientId]; if(!c) return;
  const newStage=document.getElementById('detailStageSelect').value;
  const note=document.getElementById('detailNote').value.trim();
  const reminder=document.getElementById('detailReminder').value;
  const transferTo=document.getElementById('transferTo').value;
  const now=Date.now();
  const updates={ stage:newStage, lastUpdated:now, reminder: reminder||null };
  if(transferTo && transferTo!==c.assignedTo) updates.assignedTo=transferTo;
  const historyEntry={ fromUid:c.assignedTo, toUid:transferTo||c.assignedTo, stage:newStage, note: note||(transferTo?'تم نقل العميل':'تحديث المرحلة'), timestamp:now };
  const ref=clientsRef().child(activeClientId);
  ref.update(updates).then(()=>ref.child('history').push(historyEntry)).then(()=>closeModal('detailModalBg'))
    .catch(err=>alert('فشل التحديث: '+err.message));
}

function deleteClient(){
  if(!isAdmin){ alert('حذف العملاء متاح للمسؤول فقط'); return; }
  if(!confirm('هل أنت متأكد من حذف هذا العميل؟')) return;
  clientsRef().child(activeClientId).remove().then(()=>closeModal('detailModalBg'))
    .catch(err=>alert('فشل الحذف: '+err.message));
}
</script>
