<script>
let myWorkspaceOwner = null, isAdmin = false, myDisplayName = '';
// true = full control (force states, warnings, shifts, popups, leave); false = read-only view.
let qmCanEdit = false;

function computeMemberSystems(p) {
if (p.systems) {
return {
matabaa: p.systems.matabaa || 'none', hr: p.systems.hr || 'none', manager: p.systems.manager || 'none',
accounts: p.systems.accounts || 'none', admin: p.systems.admin || 'none', sales: p.systems.sales || 'none',
departments: p.systems.departments || 'none', badala: p.systems.badala || 'none', tickets: p.systems.tickets || 'none', team: p.systems.team || 'none',
orderMapping: p.systems.orderMapping || 'none', queueMonitor: p.systems.queueMonitor || 'none',
selfService: !!p.selfService, employeeName: p.employeeName || '', employeeCardId: p.employeeCardId || ''
};
}
if (p.role === 'employee') {
return { matabaa: 'none', hr: 'none', manager: 'none', accounts: 'none', admin: 'none', sales: 'none', departments: 'none', badala: 'none', tickets: 'none', team: 'none', orderMapping: 'none', queueMonitor: 'none', selfService: true, employeeName: p.employeeName || p.name || '', employeeCardId: p.employeeCardId || '' };
}
if (p.role === 'manager') {
return { matabaa: 'none', hr: 'none', manager: p.canApprove ? 'approve' : 'view', accounts: 'none', admin: 'none', sales: 'none', departments: 'none', badala: 'none', tickets: 'none', team: 'none', orderMapping: 'none', queueMonitor: 'none', selfService: false, employeeName: '' };
}
const tabVals = Object.values(p.tabs || {});
const matabaa = tabVals.includes('edit') ? 'edit' : (tabVals.includes('view') ? 'view' : 'none');
const accounts = p.accountsAccessLevel || (p.canAccessAccounts ? 'edit' : 'none');
const hr = p.canAccessHR ? 'full' : 'none';
return { matabaa, hr, manager: 'none', accounts, admin: p.isAdmin ? 'edit' : 'none', sales: p.systems && p.systems.sales || 'none', departments: p.systems && p.systems.departments || 'none', badala: p.systems && p.systems.badala || 'none', tickets: p.systems && p.systems.tickets || 'none', team: p.systems && p.systems.team || 'none', orderMapping: p.systems && p.systems.orderMapping || 'none', queueMonitor: p.systems && p.systems.queueMonitor || 'none', selfService: false, employeeName: '', employeeCardId: '' };
}

function canUseAdminDashboard() { return true; }
function dbPath(p) { return 'users/' + myWorkspaceOwner + '/' + p; }
function currentUserBase() { return 'users/' + myWorkspaceOwner; }

function logActivity(action, details) {
if (!myWorkspaceOwner) return;
fbDB.ref('users/' + myWorkspaceOwner + '/activityLogs').push({
action, details: details || '', by: myDisplayName || 'مجهول', ts: Date.now()
}).catch(() => {});
}

function escapeHtml(str) {
return String(str == null ? '' : str)
.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function leaveTypeBadge(type) {
const t = String(type || '').trim();
const cls = (t === 'اجازة' || t === 'زمنية' || t === 'مرضية') ? t : 'other';
const icon = t === 'اجازة' ? '🏖️' : t === 'زمنية' ? '⏰' : t === 'مرضية' ? '🤒' : '📌';
return `<span class="leave-badge leave-badge-${cls}">${icon} ${escapeHtml(t || 'غير محدد')}</span>`;
}

// Used by the queue-monitor cards to flag "🏖️ إجازة اليوم" / "⏰ زمنية اليوم"
// next to an employee's name, cross-referencing the same leavesData cache.
function getTodayLeaveBadgeForName(name) {
if (!name) return '';
const today = qmToday();
const hit = (window._leavesDataCache || []).find(r => r.emp === name && r.date === today);
return hit ? leaveTypeBadge(hit.type) : '';
}

function staffMemberRef(uid) { return fbDB.ref('staffMembers/' + myWorkspaceOwner + '/' + uid); }

// Only keeps the leaves cache live (the cards read it for the 🏖️/⏰ badges and
// to exclude people on leave from the queue). The leave-history UI is not part
// of this page anymore.
let _leavesDataListenerAttached = false;
function loadLeaveHistory() {
if (_leavesDataListenerAttached) return;
_leavesDataListenerAttached = true;
fbDB.ref(dbPath('appData/leavesData')).on('value', snap => {
try { window._leavesDataCache = JSON.parse(snap.val() || '[]'); } catch (e) { window._leavesDataCache = []; }
if (_qmLastData) renderQueueMonitorTable(_qmLastData);
}, () => { _leavesDataListenerAttached = false; });
}

// ═══ Live Queue Monitor ═══
// Expected data shape written by the extension, per employee key (sanitized name):
// queueMonitor/{workspaceOwner}/{employeeKey} = {
//   name: "احمد ماجد",
//   queueCount: 3,              // rows currently in تحت التدقيق for this employee
//   working: true,               // employee's own toggle state
//   lastUpdate: <server timestamp>,
//   breakStartedAt: <timestamp or null>,  // set when working=false
//   adminForce: "working" | "break" | null // admin override written from this panel; extension must read + obey this
//   warningsToday: 2,            // # of break-overrun warnings today (resets daily on the extension side) —
//                                 // only used to drive the "> 3 today = تنزيل تقييم" flag now

function renderQueueMonitorTable(data) {

// Bug fix: this is called from a listener on the WHOLE queueMonitor/{owner}
// node (see loadQueueMonitor above), so it re-runs on any change to ANY
// employee's data — a queueCount ticking as orders are claimed, the ~20s
// live report every extension sends regardless of activity, lastUpdate
// timestamps, etc. It used to rebuild the entire table via
// container.innerHTML on every single one of those, which destroys and
// recreates every <input> in it (the per-employee break-limit and instant-
// message boxes) each time — silently wiping out whatever an admin was
// mid-typing into ANY of them, even for a completely different employee
// than the one whose data just changed, well before there was a chance to
// click the button. Snapshotting current input values (and which one had
// focus) before the rebuild, then writing them back into the freshly
// created inputs afterward, keeps unsaved text alive across a repaint it
// has nothing to do with.
const pendingInputValues = {};
container.querySelectorAll('input[id^="qm-breaklimit-input-"], input[id^="qm-popup-input-"], input[id^="qm-shiftstart-input-"], input[id^="qm-shiftend-input-"], input[id^="qm-warning-input-"]').forEach(el => {
if (el.value) pendingInputValues[el.id] = el.value;

const activeEl = document.activeElement;
const activeElId = (activeEl && typeof activeEl.id === 'string' && activeEl.id.indexOf('qm-') === 0) ? activeEl.id : null;
const activeElSelectionStart = (activeElId && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
// Same idea as the input snapshot above, but for which employee cards had
// their ⚙️ controls panel expanded — otherwise every live refresh would
// silently collapse it back shut while an admin is mid-edit.
const openControlKeys = new Set();
container.querySelectorAll('details.qm-card-controls[open]').forEach(el => { if (el.dataset.k) openControlKeys.add(el.dataset.k); });

const keys = Object.keys(data).filter(k => k !== '_pool' && k !== '_activeBreak' && qmPass((data[k] && data[k].shiftStart && data[k].shiftEnd) ? data[k].shiftStart + '-' + data[k].shiftEnd : 'none', data[k] && data[k].name || k));

</div>`;

if (keys.length === 0) {
container.innerHTML = poolBanner + '<div style="text-align:center;color:#94a3b8;padding:16px;">لا توجد بيانات بعد — تأكد من أن الإضافة تعمل لدى الموظفين.</div>';
return;
}

// order: working employees first (by when they joined the queue), then everyone else
const orderedKeys = [...keys].sort((a, b) => {
const wa = data[a].working === true, wb = data[b].working === true;
if (wa !== wb) return wa ? -1 : 1;
return (data[a].queueJoinedAt || 0) - (data[b].queueJoinedAt || 0);

let queuePosition = 0;

const rows = orderedKeys.map(key => {
const emp = data[key] || {};

<button class="btn" style="padding:5px 10px;font-size:0.78rem;background:${adminForce === 'maintenance' ? '#dc2626' : ''};color:${adminForce === 'maintenance' ? '#fff' : ''};" onclick="forceEmployeeState('${key}','maintenance')" title="علامة/تنبيه فقط — لا يمنع الموظف من العمل فعليًا">🔧 صيانة</button>

// Per-employee break duration (minutes). Read by the extension via
// GET /queuemonitor/state (breakLimitMinutes) and used instead of its
// own 15-min default — lets a manager shorten/extend break time for a
// specific person depending on current load.
// ═══ Employee session log (work/break history) ═══
// Reads queueSessions/{owner}/{employeeKey} — each child is one closed
// session: { type: 'work'|'break', startedAt, endedAt }, written by the
// relay when it receives a POST to /queuemonitor/session from the
// extension's setWorking() transitions. Requires that relay-side handler
// to exist (not part of this file) for any data to show up here.

function formatSessionDuration(ms) {
const totalMin = Math.max(0, Math.round(ms / 60000));
const h = Math.floor(totalMin / 60), m = totalMin % 60;
return h > 0 ? `${h} س ${m} د` : `${m} د`;
}

function openSessionLog(employeeKey, employeeName) {
const overlay = document.getElementById('sessionLogModalOverlay');
const title = document.getElementById('sessionLogModalTitle');
const list = document.getElementById('sessionLogModalList');
title.textContent = 'سجل أوقات العمل والاستراحة — ' + employeeName;
list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:16px;">جارِ التحميل...</div>';
overlay.style.display = 'flex';

pbList('qm_sessions', 'name_key=' + pbQ(employeeKey), '-started_at', { single: true, perPage: 100 }).then(rows => {
const sessions = rows.map(r => ({ type: r.type, startedAt: r.started_at, endedAt: r.ended_at }));
sessions.sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));

if (!sessions.length) {
list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:16px;">لا يوجد سجل بعد لهذا الموظف</div>';
return;
}

list.innerHTML = sessions.map(s => {
const isWork = s.type === 'work';
const start = s.startedAt ? new Date(s.startedAt).toLocaleString('ar-IQ-u-nu-latn') : '—';
const end = s.endedAt ? new Date(s.endedAt).toLocaleTimeString('ar-IQ-u-nu-latn') : 'جارٍ الآن';
const dur = s.endedAt && s.startedAt ? formatSessionDuration(s.endedAt - s.startedAt) : '—';
return `<div style="padding:10px 12px;border-bottom:1px solid #f0f1f4;display:flex;justify-content:space-between;align-items:center;gap:10px;">
<div style="font-size:0.82rem;line-height:1.6;">
<span style="background:${isWork ? '#dcfce7' : '#fef3c7'};color:${isWork ? '#166534' : '#92400e'};padding:2px 10px;border-radius:20px;font-weight:700;font-size:0.78rem;">${isWork ? 'عمل' : 'استراحة'}</span>
<div style="color:#4b5563;margin-top:4px;">${start} ← ${end}</div>
</div>
<div style="font-weight:800;color:#0f172a;white-space:nowrap;">${dur}</div>
</div>`;
}).join('');
}).catch(err => {
list.innerHTML = '<div style="text-align:center;color:#dc2626;padding:16px;">تعذر تحميل السجل: ' + escapeHtml(err.message) + '</div>';
});
}

function closeSessionLog() {
document.getElementById('sessionLogModalOverlay').style.display = 'none';
}

function setBreakLimit(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
const input = document.getElementById('qm-breaklimit-input-' + employeeKey);
if (!input) return;
const n = parseInt(input.value, 10);
if (isNaN(n) || n <= 0) { alert('أدخل عدد دقائق صحيح'); return; }
qmPatchEmp(employeeKey, { breakLimitMinutes: n })
.then(() => { input.value = ''; })
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
}

// Restores an employee's remaining استراحة balance for today back to the full
// daily limit. Like resetWarningsAt, the extension owns the live balance and
// re-reports it constantly, so a direct write to breakBudgetRemainingMs would
// be overwritten — instead we stamp resetBreakBudgetAt and the extension
// (pollAdminForce) applies it once when it sees a newer timestamp.
function resetEmployeeBreakBudget(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
if (!confirm('تصفير استهلاك الاستراحة لهذا الموظف وإرجاع رصيده المتبقي اليوم إلى الحد الكامل؟')) return;
qmPatchEmp(employeeKey, { resetBreakBudgetAt: Date.now() })
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
}

// Per-employee shift window ("HH:MM" strings, employee's own local clock).
// Read by the extension via GET /queuemonitor/state (shiftStart/shiftEnd)
// — see isWithinShift() in content-queuemonitor.js. Outside this window
// the extension stops running away/warning tracking entirely; if the
// employee is still actively working outside it, that time is logged as
// overtime instead (emp.overtimeMsToday, shown next to the shift label
// above) rather than penalized. Leave both fields empty to disable the
// restriction for that employee (tracking always on, the old behavior).
function setEmployeeShift(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
const startInput = document.getElementById('qm-shiftstart-input-' + employeeKey);
const endInput = document.getElementById('qm-shiftend-input-' + employeeKey);
if (!startInput || !endInput) return;
const start = startInput.value;
const end = endInput.value;
if (!start && !end) {
// both cleared — explicitly disable the restriction for this employee
qmPatchEmp(employeeKey, { shiftStart: null, shiftEnd: null })
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
return;
}
if (!start || !end) { alert('أدخل وقت البداية والنهاية معًا، أو اتركهما فارغين لإلغاء تحديد الدوام'); return; }
if (start === end) { alert('وقت البداية والنهاية لا يمكن أن يكونا متطابقين'); return; }
qmPatchEmp(employeeKey, { shiftStart: start, shiftEnd: end })
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
}

// Resets ALL of an employee's إنذارات back to zero: the persistent,
// never-expiring warningCount/warnings log (automatic + manual combined,
// see addEmployeeWarning below and addPersistentWarning() in relay.js)
// AND today's warningsToday/warningsDate that still drives the "> 3 today
// = تنزيل تقييم" flag. warningsToday can't be zeroed with a direct write
// here — the extension re-reports its own local count every ~20s and
// would clobber it right back — so that part still goes through the
// resetWarningsAt timestamp the extension/relay already watch for (see
// /queuemonitor/state in relay.js). warningCount and warnings/, which
// nothing else ever overwrites, are cleared directly.
function resetEmployeeWarnings(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
if (!confirm('تصفير كل إنذارات هذا الموظف (التلقائية واليدوية) وسجلّها بالكامل؟')) return;
qmPatchEmp(employeeKey, { resetWarningsAt: Date.now(), warningCount: 0 })
.then(() => pbList('qm_warnings', 'name_key=' + pbQ(employeeKey), '', { fields: 'id' }))
.then(rows => Promise.all(rows.map(w => pbFetch('qm_warnings/records/' + w.id, { method: 'DELETE' }))))
.then(() => { if (_qmTreeData[employeeKey]) { _qmTreeData[employeeKey].warnings = undefined; renderQueueMonitorTable(_qmTreeData); } })
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
}

// Manual إنذار from the dashboard. Writes into the SAME warningCount +
// warnings/{pushId} fields the automatic break-overrun warnings use (see
// addPersistentWarning() in relay.js) — there is only one إنذار system,
// not a separate manual one — so a manual warning shows up in exactly the
// same badge and hover tooltip as an automatic one. warningCount is
// incremented via a transaction so two admins clicking at once (or a
// double click) can't race and silently drop an increment.
function addEmployeeWarning(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
const input = document.getElementById('qm-warning-input-' + employeeKey);
const reason = input ? (input.value || '').trim() : '';
if (!confirm('إضافة إنذار لهذا الموظف؟' + (reason ? ('\n\nالسبب: ' + reason) : ''))) return;
// The employee sees this as the persistent ⚠️ badge next to their toggle
// button (qm-warning-badge in content-queuemonitor.js, fed by
// warningCount via /queuemonitor/state) — not a popup.
pbFetch('qm_warnings/records', { method: 'POST', body: JSON.stringify({
name_key: employeeKey, text: reason || '', created_at: Date.now(), source: 'manual'
}) })
// "warning_count+" is PocketBase's atomic increment, so two admins clicking at once can't drop one
.then(() => qmPatchEmp(employeeKey, {}, { 'warning_count+': 1 }))
.then(() => { _qmWarnCount[employeeKey] = -1; return qmPollOnce(); })
.then(() => { if (input) input.value = ''; })
.catch(err => alert('فشل إضافة الإنذار: ' + err.message));
}

// Instant one-off popup message to a single employee. The extension
// polls every few seconds and shows it as a modal as soon as it lands
// (no read-receipt tracking like the department announcements above —
// this is meant for quick "right now" nudges, not broadcasts).
function sendEmployeePopup(employeeKey) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
const input = document.getElementById('qm-popup-input-' + employeeKey);
if (!input) return;
const text = (input.value || '').trim();
if (!text) { alert('اكتب نص الرسالة أولاً'); return; }
qmPatchEmp(employeeKey, { popup: { id: Date.now(), text, createdAt: Date.now() } })
.then(() => { input.value = ''; })
.catch(err => alert('فشل الإرسال: ' + err.message));
}

function forceEmployeeState(employeeKey, forceValue) {
if (!qmCanEdit) { alert('🚫 صلاحيتك عرض فقط.'); return; }
const updates = { adminForce: forceValue };
if (forceValue === 'working') updates.queueJoinedAt = Date.now();
qmPatchEmp(employeeKey, updates)
.catch(err => alert('فشل تنفيذ الأمر: ' + err.message));
}

// ═══ Quick إجازة/زمنية toggle from inside a queue-monitor card ═══
// Writes into the SAME appData/leavesData array as the dedicated
// "تسجيل إجازة أو زمنية" form (submitManualLeave), so it shows up in the
// leave history and drives the existing "🏖️/⏰ اليوم" badge — this is just a
// one-tap shortcut for "mark them off today", always dated today, with no
// notes or زمنية hour-range (use the full form for that level of detail).
// Looks the employee's name up from queueMonitor by key rather than passing
// it through the onclick string, since names can contain characters (') that
// would break inline HTML attributes.
function qmSetTodayLeaveFromCard(employeeKey, type) {
if (!qmCanEdit) return;
Promise.resolve().then(() => {
const name = (_qmTreeData[employeeKey] && _qmTreeData[employeeKey].name) || employeeKey;
return qmApplyTodayLeave(name, type);
}).catch(err => alert('تعذّر التسجيل: ' + (err && err.message ? err.message : err)));
}

function qmClearTodayLeaveFromCard(employeeKey) {
if (!qmCanEdit) return;
Promise.resolve().then(() => {
const name = (_qmTreeData[employeeKey] && _qmTreeData[employeeKey].name) || employeeKey;
return qmClearTodayLeave(name);
}).catch(err => alert('تعذّر الإلغاء: ' + (err && err.message ? err.message : err)));
}

function qmApplyTodayLeave(name, type) {
if (!qmCanEdit) return Promise.reject(new Error('صلاحيتك عرض فقط'));
const today = qmToday();
return fbDB.ref(dbPath('appData/leavesData')).once('value').then(lsnap => {
let leaves = [];
try { leaves = JSON.parse(lsnap.val() || '[]'); } catch (e) { leaves = []; }
leaves = leaves.filter(r => !(r.emp === name && r.date === today)); // one record/day from this shortcut
leaves.push({ emp: name, date: today, type, notes: '', id: Date.now(), zmanya_from: '', zmanya_to: '', hours: null, sickProofImage: null, addedBy: myDisplayName || 'المشرف' });
leaves.sort((a, b) => new Date(b.date) - new Date(a.date));
return fbDB.ref(dbPath('appData/leavesData')).set(JSON.stringify(leaves));
}).then(() => {
logActivity('تسجيل إجازة/زمنية من بطاقة المتابعة', `${name} — ${type} — ${today}`);
});
}

function qmClearTodayLeave(name) {
if (!qmCanEdit) return Promise.reject(new Error('صلاحيتك عرض فقط'));
const today = qmToday();
return fbDB.ref(dbPath('appData/leavesData')).once('value').then(lsnap => {
let leaves = [];
try { leaves = JSON.parse(lsnap.val() || '[]'); } catch (e) { leaves = []; }
const before = leaves.length;
leaves = leaves.filter(r => !(r.emp === name && r.date === today));
if (leaves.length === before) return;
return fbDB.ref(dbPath('appData/leavesData')).set(JSON.stringify(leaves)).then(() => {
logActivity('إلغاء إجازة/زمنية اليوم من بطاقة المتابعة', `${name} — ${today}`);
});
});
}


// ═══ Auth gate + boot: workspace admin = full control; staff need systems.queueMonitor = 'view' (read-only) or 'edit' (full control) ═══
function boot() {
document.getElementById('roleNotice').style.display = 'none';
document.getElementById('adminRoot').style.display = 'block';
if (!qmCanEdit) {
const b = document.getElementById('qmModeBadge'); if (b) b.style.display = 'inline-block';
const h = document.getElementById('qmEditHint'); if (h) h.style.display = 'none';
}
loadQueueMonitor();
qmSetView('live');
}

fbAuth.onAuthStateChanged(function (user) {
if (!user) {
document.getElementById('roleNotice').textContent = 'الرجاء تسجيل الدخول أولاً';
return;
}
fbDB.ref('admins/' + user.uid).once('value').then(adminSnap => {
if (adminSnap.val() === true) {
isAdmin = true;
qmCanEdit = true;
myWorkspaceOwner = user.uid;
myDisplayName = (fbAuth.currentUser && fbAuth.currentUser.displayName) || 'المشرف';
boot();
return;
}
fbDB.ref('memberIndex/' + user.uid).once('value').then(idxSnap => {
const owner = idxSnap.val();
if (!owner) { document.getElementById('roleNotice').textContent = '🚫 ليس لديك صلاحية الوصول.'; return; }
myWorkspaceOwner = owner;
staffMemberRef(user.uid).once('value').then(pSnap => {
const p = pSnap.val() || {};
const sys = computeMemberSystems(p);
if (!sys.queueMonitor || sys.queueMonitor === 'none') {
document.getElementById('roleNotice').textContent = '🚫 ليس لديك صلاحية الوصول.';
return;
}
myDisplayName = p.name || p.phone || '';
qmCanEdit = (sys.queueMonitor === 'edit');
boot();
});
});
});
});
</script>
<div id="sessionLogModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:9999;align-items:center;justify-content:center;padding:16px">
<div style="background:#fff;border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;gap:12px">
<div id="sessionLogModalTitle" style="font-weight:800;font-size:0.95rem;color:var(--text-main)">سجل الموظف</div>
<div id="sessionLogModalList" style="overflow-y:auto;max-height:400px"></div>
<div style="display:flex;justify-content:flex-end;">
<button onclick="closeSessionLog()" class="btn" style="padding:6px 14px;font-size:0.8rem">إغلاق</button>
</div>
</div>
</div>
</body>
