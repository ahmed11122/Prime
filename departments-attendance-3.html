<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif; background:#f3f6fa; color:#1e293b; }

  .topbar { display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#0c1a30,#16283d); color:#fff; padding:14px 20px; box-shadow:0 2px 10px rgba(12,26,48,0.25); }
  .topbar-back { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#fff; padding:7px 16px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:0.85rem; transition:background .15s; }
  .topbar-back:hover { background:rgba(255,255,255,0.16); }
  .topbar-title { font-weight:800; font-size:1rem; letter-spacing:.2px; }
  .topbar-user { color:#0c1a30; font-weight:700; font-size:0.85rem; background:#fff; padding:6px 14px; border-radius:20px; }

  #loadingOverlay { display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; gap:14px; }
  .spin { width:46px; height:46px; border:4px solid #dbe4f0; border-top-color:#0c1a30; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #noticeBox { display:none; text-align:center; padding:60px 20px; color:#64748b; font-size:0.95rem; }

  .wrap { display:none; padding:20px; max-width:1400px; margin:0 auto; }

  .dept-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .dept-tab { flex:0 0 auto; padding:9px 20px; border-radius:22px; border:1.5px solid #dbe2ea; background:#fff; cursor:pointer; font-family:inherit; font-size:0.85rem; font-weight:700; color:#334155; white-space:nowrap; transition:all .15s; }
  .dept-tab:hover { border-color:#0c1a30; }
  .dept-tab.active { background:#0c1a30; border-color:#0c1a30; color:#fff; box-shadow:0 3px 10px rgba(12,26,48,0.25); }
  .dept-tab-add { flex:0 0 auto; padding:9px 16px; border-radius:22px; border:1.5px dashed #94a3b8; background:transparent; cursor:pointer; font-family:inherit; font-size:0.85rem; color:#475569; }
  .dept-tab-add:hover { border-color:#0c1a30; color:#0c1a30; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .stat-card { background:#fff; border:1px solid #eef1f5; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 10px rgba(15,23,42,0.04); }
  .stat-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex-shrink:0; }
  .stat-num { font-weight:800; font-size:1.15rem; color:#0c1a30; line-height:1.1; }
  .stat-label { font-size:0.72rem; color:#64748b; font-weight:700; margin-top:2px; }

  .toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:10px 14px; }
  .week-nav { display:flex; align-items:center; gap:8px; }
  .week-nav button { background:#f3f6fa; border:1.5px solid #dbe2ea; border-radius:8px; padding:7px 12px; cursor:pointer; font-family:inherit; font-size:0.85rem; font-weight:700; color:#334155; }
  .week-nav button:hover { background:#e8edf3; }
  .week-range { font-weight:700; font-size:0.85rem; color:#0c1a30; background:#f3f6fa; border:1.5px solid #e2e8f0; border-radius:8px; padding:7px 12px; }
  .dept-actions { display:flex; gap:8px; }
  .btn-sm { border:none; border-radius:8px; padding:7px 14px; cursor:pointer; font-family:inherit; font-size:0.8rem; font-weight:700; transition:filter .15s; }
  .btn-sm:hover { filter:brightness(0.95); }
  .btn-blue { background:#0c1a30; color:#fff; }
  .btn-gray { background:#e2e8f0; color:#334155; }
  .btn-red { background:#fee2e2; color:#dc2626; }
  .btn-green { background:#dcfce7; color:#16a34a; }

  .grid-scroll { overflow-x:auto; background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(15,23,42,0.08); border:1px solid #eef1f5; }
  table.att-table { border-collapse:collapse; width:100%; min-width:640px; }
  table.att-table th, table.att-table td { border:1px solid #eef1f5; padding:0; text-align:center; }
  .name-col { position:sticky; right:0; background:#fff; z-index:2; min-width:170px; text-align:right !important; padding:10px 14px !important; font-weight:700; font-size:0.85rem; }
  thead .name-col { background:#0c1a30; color:#fff; z-index:3; }
  .head-weekday { background:#16283d; color:#fff; font-weight:800; font-size:0.8rem; padding:9px 4px; min-width:96px; }
  .head-date { background:#f3f6fa; color:#475569; font-weight:800; font-size:0.78rem; padding:6px 4px; border-top:none; }
  .att-cell { padding:6px !important; min-width:96px; }
  .att-select { width:100%; padding:8px 4px; border-radius:8px; border:1.5px solid #d7dce3; font-family:inherit; font-size:0.78rem; font-weight:800; cursor:pointer; background:#fff; color:#334155; transition:all .12s; appearance:none; -webkit-appearance:none; text-align:center; text-align-last:center; }
  .att-select[data-status=""] { background:#f8fafc; color:#cbd5e1; border-color:#e2e8f0; }
  .att-select[data-status="حاضر"] { background:#dcfce7; color:#15803d; border-color:#86efac; }
  .att-select[data-status="اجازة"] { background:#ede9fe; color:#6d28d9; border-color:#c4b5fd; }
  .att-select[data-status="غياب"] { background:#fee2e2; color:#b91c1c; border-color:#fca5a5; }
  .att-select[data-status="اوف"] { background:#e2e8f0; color:#334155; border-color:#cbd5e1; }
  .att-select[data-status="زمنية"] { background:#fef3c7; color:#92400e; border-color:#fcd34d; }
  .att-badge { display:inline-block; padding:6px 10px; border-radius:8px; font-size:0.78rem; font-weight:800; min-width:60px; }
  .st-present { background:#dcfce7; color:#16a34a; }
  .st-leave { background:#ede9fe; color:#7c3aed; }
  .st-absent { background:#fee2e2; color:#dc2626; }
  .st-off { background:#e2e8f0; color:#475569; }
  .st-partial { background:#fef3c7; color:#92400e; }
  .st-empty { background:#f8fafc; color:#cbd5e1; }

  .emp-row-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .emp-del-btn { background:none; border:none; color:#dc2626; cursor:pointer; font-size:0.85rem; padding:2px 4px; }

  .add-emp-bar { display:flex; gap:8px; padding:14px; align-items:center; background:#fff; border:1px solid #e2e8f0; border-radius:12px; margin-top:14px; }
  .add-emp-bar input { flex:1; max-width:260px; padding:8px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:0.85rem; }

  .empty-state { text-align:center; padding:40px 20px; color:#94a3b8; font-size:0.9rem; }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(12,26,48,0.55); z-index:9500; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border-radius:16px; padding:22px; width:320px; max-width:90vw; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .modal-box h3 { margin:0 0 14px; font-size:1rem; color:#0c1a30; }
  .modal-box input { width:100%; padding:9px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:0.9rem; margin-bottom:14px; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="goBack()">→ رجوع لاختيار النظام</button>
  <div class="topbar-title">📋 متابعة الحضور</div>
  <span class="topbar-user" id="headerUserName" style="display:none"></span>
</div>

<div id="loadingOverlay"><div class="spin"></div><div style="color:#64748b;font-size:0.9rem">جارِ التحميل...</div></div>
<div id="noticeBox"></div>

<div class="wrap" id="mainWrap">

  <div class="dept-tabs" id="deptTabs"></div>

  <div class="stats-row" id="statsRow"></div>

  <div class="toolbar">
    <div class="week-nav">
      <button onclick="shiftWeek(-1)">▶ الأسبوع السابق</button>
      <span class="week-range" id="weekRangeLabel"></span>
      <button onclick="shiftWeek(1)">الأسبوع التالي ◀</button>
      <button onclick="jumpToToday()">اليوم</button>
    </div>
    <div class="dept-actions" id="deptActionsBar"></div>
  </div>

  <div class="grid-scroll">
    <table class="att-table" id="attTable"></table>
  </div>

  <div class="add-emp-bar" id="addEmpBar" style="display:none">
    <input type="text" id="newEmpName" placeholder="اسم الموظف الجديد">
    <button class="btn-sm btn-blue" onclick="addEmployee()">+ إضافة موظف</button>
  </div>

</div>

<!-- Add / rename department modal -->
<div class="modal-bg" id="deptModal">
  <div class="modal-box">
    <h3 id="deptModalTitle">قسم جديد</h3>
    <input type="text" id="deptModalInput" placeholder="اسم القسم">
    <div class="modal-btns">
      <button class="btn-sm btn-gray" onclick="closeDeptModal()">إلغاء</button>
      <button class="btn-sm btn-blue" onclick="saveDeptModal()">حفظ</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE — same project as index.html
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyA1q9LiS6EXNCBFmFvytyN-p4KKgP9wym4",
  authDomain: "prime-e-8eb80.firebaseapp.com",
  databaseURL: "https://prime-e-8eb80-default-rtdb.firebaseio.com",
  projectId: "prime-e-8eb80",
  storageBucket: "prime-e-8eb80.firebasestorage.app",
  messagingSenderId: "671376930301",
  appId: "1:671376930301:web:f8b61666314f3149fb5594"
};
firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();
const fbAuth = firebase.auth();

// ═══════════════════════════════════════════════════════════════
// AUTH / PERMISSIONS — resolved fresh here (same pattern as
// admin-dashboard.html), NOT trusted from URL params, since this file
// can be opened directly and Firebase Auth is shared across the
// same-origin iframe session set up by index.html.
// ═══════════════════════════════════════════════════════════════
let myWorkspaceOwner = null;
let isAdmin = false;
let myDisplayName = '';
let myDepartmentAccess = 'none';   // 'none' / 'view' / 'edit' — from systems.departments
let myOwnDepartment = '';          // non-admin managers are scoped to this department only
let canManageDepts = false;        // true owner OR a delegated admin (systems.admin === 'edit') — allowed to create/rename/delete departments and employees

function computeMemberSystems(p) {
  if (p.systems) {
    return {
      matabaa: p.systems.matabaa || 'none', hr: p.systems.hr || 'none', manager: p.systems.manager || 'none',
      accounts: p.systems.accounts || 'none', admin: p.systems.admin || 'none', sales: p.systems.sales || 'none',
      departments: p.systems.departments || 'none',
      selfService: !!p.selfService, employeeName: p.employeeName || ''
    };
  }
  return { matabaa: 'none', hr: 'none', manager: 'none', accounts: 'none', admin: p.isAdmin ? 'edit' : 'none', sales: 'none', departments: 'none', selfService: false, employeeName: '' };
}

function staffMemberRef(uid) { return fbDB.ref('staffMembers/' + myWorkspaceOwner + '/' + uid); }

function showNotice(msg) {
  document.getElementById('loadingOverlay').style.display = 'none';
  const n = document.getElementById('noticeBox');
  n.textContent = msg;
  n.style.display = 'block';
}

fbAuth.onAuthStateChanged(function (user) {
  if (!user) { showNotice('الرجاء تسجيل الدخول من الملف الرئيسي أولاً'); return; }
  fbDB.ref('admins/' + user.uid).once('value').then(adminSnap => {
    if (adminSnap.val() === true) {
      isAdmin = true;
      myWorkspaceOwner = user.uid;
      myDepartmentAccess = 'edit';
      canManageDepts = true;
      myDisplayName = (fbAuth.currentUser && fbAuth.currentUser.displayName) || 'المشرف';
      boot();
      return;
    }
    fbDB.ref('memberIndex/' + user.uid).once('value').then(idxSnap => {
      const owner = idxSnap.val();
      if (!owner) { showNotice('حساب غير مرتبط بمساحة عمل'); return; }
      myWorkspaceOwner = owner;
      staffMemberRef(user.uid).once('value').then(pSnap => {
        const p = pSnap.val() || {};
        const sys = computeMemberSystems(p);
        const isDelegatedAdmin = sys.admin === 'edit';
        if (sys.departments === 'none' && !isDelegatedAdmin) {
          showNotice('🚫 ليس لديك صلاحية الوصول إلى نظام متابعة الأقسام. الرجاء التواصل مع المشرف لمنحك هذه الصلاحية.');
          return;
        }
        canManageDepts = isDelegatedAdmin;
        myDepartmentAccess = isDelegatedAdmin ? 'edit' : sys.departments; // delegated admins get full edit, unscoped
        myOwnDepartment = (p.department || '').trim();
        myDisplayName = p.name || p.phone || '';
        boot();
      });
    });
  }).catch(() => showNotice('تعذّر الاتصال بقاعدة البيانات'));
});

function goBack() {
  if (window.parent && window.parent !== window && typeof window.parent.backToChooserFromDepartments === 'function') {
    window.parent.backToChooserFromDepartments();
  } else {
    history.back();
  }
}

// ═══════════════════════════════════════════════════════════════
// DATA PATHS
// ═══════════════════════════════════════════════════════════════
function rootRef() { return fbDB.ref('departmentsAttendance/' + myWorkspaceOwner); }
function deptsRef() { return rootRef().child('depts'); }
function deptRef(id) { return deptsRef().child(id); }
function recordsRef(deptId, dateStr) { return rootRef().child('records/' + deptId + '/' + dateStr); }

const STATUS_OPTIONS = [
  { value: '', label: '—' },
  { value: 'حاضر', label: 'حاضر' },
  { value: 'اجازة', label: 'اجازة' },
  { value: 'غياب', label: 'غياب' },
  { value: 'اوف', label: 'اوف' },
  { value: 'زمنية', label: 'زمنية' }
];
const STATUS_CLASS = { 'حاضر': 'st-present', 'اجازة': 'st-leave', 'غياب': 'st-absent', 'اوف': 'st-off', 'زمنية': 'st-partial', '': 'st-empty' };

let allDepts = {};       // { deptId: { name, order, employees: {empId:{name,order}} } }
let activeDeptId = null;
let weekStart = startOfWeek(new Date());
let currentRecords = {}; // { dateStr: { empId: status } }
let recordsListenerRef = null;

function startOfWeek(d) {
  const dt = new Date(d);
  dt.setHours(0, 0, 0, 0);
  return dt;
}
function fmtDateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const WEEKDAY_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function boot() {
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  const nameEl = document.getElementById('headerUserName');
  if (myDisplayName) { nameEl.textContent = '👤 ' + myDisplayName; nameEl.style.display = ''; }
  renderDeptActionsBar();
  deptsRef().on('value', snap => {
    allDepts = snap.val() || {};
    // Non-admin managers only ever see their own department's tab.
    const visibleIds = Object.keys(allDepts).filter(id => canManageDepts || (allDepts[id].name || '').trim() === myOwnDepartment);
    if (!activeDeptId || !visibleIds.includes(activeDeptId)) {
      activeDeptId = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0))[0] || null;
    }
    renderDeptTabs(visibleIds);
    renderWeekRange();
    attachRecordsListener();
    renderTable();
  });
}

function renderDeptActionsBar() {
  const bar = document.getElementById('deptActionsBar');
  if (!canManageDepts) { bar.innerHTML = ''; return; }
  if (!activeDeptId) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <button class="btn-sm btn-red" onclick="deleteActiveDept()">🗑️ حذف القسم</button>
    <button class="btn-sm btn-gray" onclick="openRenameDeptModal()">✏️ إعادة تسمية</button>
  `;
}

function renderDeptTabs(visibleIds) {
  const wrap = document.getElementById('deptTabs');
  const sorted = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0));
  let html = sorted.map(id => {
    const d = allDepts[id];
    return `<button class="dept-tab ${id === activeDeptId ? 'active' : ''}" onclick="selectDept('${id}')">${escapeHtml(d.name || '')}</button>`;
  }).join('');
  if (canManageDepts) html += `<button class="dept-tab-add" onclick="openNewDeptModal()">+ قسم جديد</button>`;
  wrap.innerHTML = html || '<div class="empty-state" style="padding:6px 0">لا توجد أقسام بعد</div>';
}

function selectDept(id) {
  activeDeptId = id;
  renderDeptTabs(Object.keys(allDepts).filter(i => canManageDepts || (allDepts[i].name || '').trim() === myOwnDepartment));
  attachRecordsListener();
  renderTable();
}

function shiftWeek(dir) {
  weekStart = new Date(weekStart.getTime() + dir * 7 * 86400000);
  renderWeekRange();
  attachRecordsListener();
  renderTable();
}
function jumpToToday() {
  weekStart = startOfWeek(new Date());
  renderWeekRange();
  attachRecordsListener();
  renderTable();
}
function renderWeekRange() {
  const end = new Date(weekStart.getTime() + 6 * 86400000);
  const fmt = d => d.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' });
  document.getElementById('weekRangeLabel').textContent = `${fmt(weekStart)} — ${fmt(end)}`;
}

function weekDates() {
  const arr = [];
  for (let i = 0; i < 7; i++) arr.push(new Date(weekStart.getTime() + i * 86400000));
  return arr;
}

function attachRecordsListener() {
  if (recordsListenerRef) recordsListenerRef.off();
  currentRecords = {};
  if (!activeDeptId) { renderTable(); return; }
  const dates = weekDates();
  const first = fmtDateKey(dates[0]), last = fmtDateKey(dates[6]);
  recordsListenerRef = rootRef().child('records/' + activeDeptId).orderByKey().startAt(first).endAt(last);
  recordsListenerRef.on('value', snap => {
    currentRecords = snap.val() || {};
    renderTable();
  });
}

function canEditActiveDept() {
  if (myDepartmentAccess !== 'edit') return false;
  if (canManageDepts) return true;
  const d = allDepts[activeDeptId];
  return !!d && (d.name || '').trim() === myOwnDepartment;
}

function renderStats() {
  const row = document.getElementById('statsRow');
  if (!activeDeptId || !allDepts[activeDeptId]) { row.innerHTML = ''; return; }
  const counts = { 'حاضر': 0, 'اجازة': 0, 'غياب': 0, 'اوف': 0, 'زمنية': 0 };
  Object.values(currentRecords).forEach(day => {
    Object.values(day || {}).forEach(v => { if (counts.hasOwnProperty(v)) counts[v]++; });
  });
  const cards = [
    { key:'حاضر', label:'حاضر', icon:'✅', bg:'#dcfce7', color:'#15803d' },
    { key:'اجازة', label:'اجازة', icon:'🌴', bg:'#ede9fe', color:'#6d28d9' },
    { key:'غياب', label:'غياب', icon:'🚫', bg:'#fee2e2', color:'#b91c1c' },
    { key:'اوف', label:'اوف', icon:'💤', bg:'#e2e8f0', color:'#334155' },
    { key:'زمنية', label:'زمنية', icon:'⏱️', bg:'#fef3c7', color:'#92400e' }
  ];
  row.innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg};color:${c.color}">${c.icon}</div>
      <div><div class="stat-num">${counts[c.key]}</div><div class="stat-label">${c.label}</div></div>
    </div>`).join('');
}

function renderTable() {
  renderStats();
  const table = document.getElementById('attTable');
  const addBar = document.getElementById('addEmpBar');
  if (!activeDeptId || !allDepts[activeDeptId]) {
    table.innerHTML = '<tr><td class="empty-state">اختر قسمًا أو أنشئ قسمًا جديدًا للبدء</td></tr>';
    addBar.style.display = 'none';
    return;
  }
  const dept = allDepts[activeDeptId];
  const employees = dept.employees || {};
  const empIds = Object.keys(employees).sort((a, b) => (employees[a].order || 0) - (employees[b].order || 0));
  const dates = weekDates();
  const canEdit = canEditActiveDept();

  let thead = '<thead><tr><th class="name-col">المتابعة</th>' +
    dates.map(d => `<th class="head-weekday">${WEEKDAY_AR[d.getDay()]}</th>`).join('') + '</tr>' +
    '<tr><th class="name-col" style="background:#e8823c"></th>' +
    dates.map(d => `<th class="head-date">${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}</th>`).join('') + '</tr></thead>';

  let rows = empIds.map(empId => {
    const emp = employees[empId];
    const cells = dates.map(d => {
      const key = fmtDateKey(d);
      const status = (currentRecords[key] || {})[empId] || '';
      if (canEdit) {
        const opts = STATUS_OPTIONS.map(o => `<option value="${o.value}" ${o.value === status ? 'selected' : ''}>${o.label}</option>`).join('');
        return `<td class="att-cell"><select class="att-select" data-status="${status}" onchange="this.dataset.status=this.value; setStatus('${key}','${empId}',this.value)">${opts}</select></td>`;
      }
      const cls = STATUS_CLASS[status] || 'st-empty';
      return `<td class="att-cell"><span class="att-badge ${cls}">${status || '—'}</span></td>`;
    }).join('');
    const nameCell = canManageDepts
      ? `<td class="name-col"><div class="emp-row-tools"><span>${escapeHtml(emp.name || '')}</span><button class="emp-del-btn" title="حذف الموظف" onclick="removeEmployee('${empId}')">✕</button></div></td>`
      : `<td class="name-col">${escapeHtml(emp.name || '')}</td>`;
    return `<tr>${nameCell}${cells}</tr>`;
  }).join('');

  table.innerHTML = thead + '<tbody>' + (rows || `<tr><td class="empty-state" colspan="${dates.length + 1}">لا يوجد موظفون في هذا القسم بعد</td></tr>`) + '</tbody>';

  addBar.style.display = canManageDepts ? 'flex' : 'none';
}

function setStatus(dateKey, empId, value) {
  if (!canEditActiveDept()) return;
  const ref = recordsRef(activeDeptId, dateKey).child(empId);
  if (value) ref.set(value); else ref.remove();
}

// ── Employee management (admin only) ────────────────────────────
function addEmployee() {
  if (!canManageDepts || !activeDeptId) return;
  const input = document.getElementById('newEmpName');
  const name = input.value.trim();
  if (!name) return;
  const empId = deptRef(activeDeptId).child('employees').push().key;
  const dept = allDepts[activeDeptId] || {};
  const count = Object.keys(dept.employees || {}).length;
  deptRef(activeDeptId).child('employees/' + empId).set({ name, order: count }).then(() => {
    input.value = '';
  });
}
function removeEmployee(empId) {
  if (!canManageDepts || !activeDeptId) return;
  if (!confirm('حذف هذا الموظف من القسم؟ (سجل حضوره السابق سيبقى محفوظًا)')) return;
  deptRef(activeDeptId).child('employees/' + empId).remove();
}

// ── Department management (admin only) ──────────────────────────
let deptModalMode = 'new'; // 'new' | 'rename'
function openNewDeptModal() {
  deptModalMode = 'new';
  document.getElementById('deptModalTitle').textContent = 'قسم جديد';
  document.getElementById('deptModalInput').value = '';
  document.getElementById('deptModal').style.display = 'flex';
}
function openRenameDeptModal() {
  if (!activeDeptId) return;
  deptModalMode = 'rename';
  document.getElementById('deptModalTitle').textContent = 'إعادة تسمية القسم';
  document.getElementById('deptModalInput').value = allDepts[activeDeptId].name || '';
  document.getElementById('deptModal').style.display = 'flex';
}
function closeDeptModal() { document.getElementById('deptModal').style.display = 'none'; }
function saveDeptModal() {
  const name = document.getElementById('deptModalInput').value.trim();
  if (!name) return;
  if (deptModalMode === 'new') {
    const id = deptsRef().push().key;
    const count = Object.keys(allDepts).length;
    deptsRef().child(id).set({ name, order: count, employees: {} }).then(() => { activeDeptId = id; closeDeptModal(); });
  } else {
    deptRef(activeDeptId).child('name').set(name).then(closeDeptModal);
  }
}
function deleteActiveDept() {
  if (!canManageDepts || !activeDeptId) return;
  const name = (allDepts[activeDeptId] || {}).name || '';
  if (!confirm(`حذف قسم "${name}" بكل موظفيه وسجل حضوره؟ لا يمكن التراجع عن هذا.`)) return;
  const id = activeDeptId;
  deptRef(id).remove();
  rootRef().child('records/' + id).remove();
  activeDeptId = null;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
