<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif; background:#f3f6fa; color:#1e293b; }

  .topbar { display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#0c1a30,#16283d); color:#fff; padding:14px 20px; box-shadow:0 2px 10px rgba(12,26,48,0.25); }
  .topbar-back { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#fff; padding:7px 16px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:0.85rem; transition:background .15s; }
  .topbar-back:hover { background:rgba(255,255,255,0.16); }
  .topbar-title { font-weight:800; font-size:1rem; letter-spacing:.2px; }
  .topbar-user { color:#0c1a30; font-weight:700; font-size:0.85rem; background:#fff; padding:6px 14px; border-radius:20px; }

  #loadingOverlay { display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; gap:14px; }
  .spin { width:46px; height:46px; border:4px solid #dbe4f0; border-top-color:#0c1a30; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #noticeBox { display:none; text-align:center; padding:60px 20px; color:#64748b; font-size:0.95rem; }

  .wrap { display:none; padding:20px; max-width:1400px; margin:0 auto; }

  .dept-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .dept-tab { flex:0 0 auto; padding:9px 20px; border-radius:22px; border:1.5px solid #dbe2ea; background:#fff; cursor:pointer; font-family:inherit; font-size:0.85rem; font-weight:700; color:#334155; white-space:nowrap; transition:all .15s; }
  .dept-tab:hover { border-color:#0c1a30; }
  .dept-tab.active { background:#0c1a30; border-color:#0c1a30; color:#fff; box-shadow:0 3px 10px rgba(12,26,48,0.25); }
  .dept-tab-add { flex:0 0 auto; padding:9px 16px; border-radius:22px; border:1.5px dashed #94a3b8; background:transparent; cursor:pointer; font-family:inherit; font-size:0.85rem; color:#475569; }
  .dept-tab-add:hover { border-color:#0c1a30; color:#0c1a30; }

  .kpi-row { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:820px) { .kpi-row { grid-template-columns:1fr; } }
  .kpi-card { background:#fff; border:1px solid #eef1f5; border-radius:16px; padding:16px 18px; box-shadow:0 2px 12px rgba(15,23,42,0.05); }
  .kpi-title { font-size:0.8rem; font-weight:800; color:#334155; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .kpi-big { font-size:1.7rem; font-weight:800; color:#0c1a30; }
  .kpi-sub { font-size:0.72rem; color:#94a3b8; font-weight:700; margin-top:2px; }
  .kpi-delta { font-size:0.72rem; font-weight:800; color:#16a34a; background:#dcfce7; padding:2px 7px; border-radius:6px; margin-inline-start:6px; }
  .bar-track { display:flex; height:10px; border-radius:6px; overflow:hidden; margin:12px 0 8px; background:#f1f5f9; }
  .bar-seg { height:100%; }
  .bar-legend { display:flex; gap:14px; flex-wrap:wrap; }
  .bar-legend-item { font-size:0.72rem; color:#64748b; font-weight:700; display:flex; align-items:center; gap:5px; }
  .bar-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .kpi-split { display:flex; align-items:flex-end; gap:6px; }
  .donut-wrap { display:flex; align-items:center; gap:14px; }
  .donut { width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .donut-inner { width:64px; height:64px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.95rem; color:#0c1a30; }

  .emp-search { flex:1; min-width:180px; max-width:260px; padding:8px 12px; border:1.5px solid #dbe2ea; border-radius:9px; font-family:inherit; font-size:0.82rem; background:#f8fafc; }
  .filter-select { padding:8px 10px; border:1.5px solid #dbe2ea; border-radius:9px; font-family:inherit; font-size:0.8rem; background:#f8fafc; color:#334155; cursor:pointer; }

  .toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:10px 14px; }
  .month-nav { display:flex; align-items:center; gap:8px; }
  .month-nav button { background:#f3f6fa; border:1.5px solid #dbe2ea; border-radius:8px; padding:7px 12px; cursor:pointer; font-family:inherit; font-size:0.85rem; font-weight:700; color:#334155; }
  .month-nav button:hover { background:#e8edf3; }
  .day-input { padding:7px 10px; border:1.5px solid #dbe2ea; border-radius:8px; font-family:inherit; font-size:0.8rem; color:#334155; background:#fff; }
  .month-context { font-size:0.78rem; color:#94a3b8; font-weight:700; margin:-8px 4px 14px; }
  .month-range { font-weight:700; font-size:0.85rem; color:#0c1a30; background:#f3f6fa; border:1.5px solid #e2e8f0; border-radius:8px; padding:7px 12px; white-space:nowrap; }
  .dept-actions { display:flex; gap:8px; }
  .btn-sm { border:none; border-radius:8px; padding:7px 14px; cursor:pointer; font-family:inherit; font-size:0.8rem; font-weight:700; transition:filter .15s; }
  .btn-sm:hover { filter:brightness(0.95); }
  .btn-blue { background:#0c1a30; color:#fff; }
  .btn-gray { background:#e2e8f0; color:#334155; }
  .btn-red { background:#fee2e2; color:#dc2626; }
  .btn-green { background:#dcfce7; color:#16a34a; }

  .list-card { background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(15,23,42,0.08); border:1px solid #eef1f5; overflow:hidden; }
  .list-head-row { display:grid; grid-template-columns:44px 2fr 1.3fr 1.1fr; align-items:center; padding:11px 16px; background:#f8fafc; border-bottom:1px solid #eef1f5; font-size:0.74rem; font-weight:800; color:#64748b; }
  .list-row { display:grid; grid-template-columns:44px 2fr 1.3fr 1.1fr; align-items:center; padding:10px 16px; border-bottom:1px solid #f3f6fa; }
  .list-row:last-child { border-bottom:none; }
  .list-row:hover { background:#fafbfd; }
  .emp-avatar { width:30px; height:30px; border-radius:50%; background:#0c1a30; color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:800; flex-shrink:0; }
  .emp-name-cell { display:flex; align-items:center; gap:10px; font-weight:700; font-size:0.85rem; color:#1e293b; }
  .date-cell { font-size:0.8rem; color:#475569; font-weight:600; }
  .date-cell .wd { color:#94a3b8; font-size:0.72rem; margin-inline-start:6px; }

  .att-cell { padding:0; }
  .att-select { width:100%; padding:8px 4px; border-radius:8px; border:1.5px solid #d7dce3; font-family:inherit; font-size:0.78rem; font-weight:800; cursor:pointer; background:#fff; color:#334155; transition:all .12s; appearance:none; -webkit-appearance:none; text-align:center; text-align-last:center; }
  .att-select[data-status=""] { background:#f8fafc; color:#cbd5e1; border-color:#e2e8f0; }
  .att-select[data-status="حاضر"] { background:#dcfce7; color:#15803d; border-color:#86efac; }
  .att-select[data-status="اجازة"] { background:#ede9fe; color:#6d28d9; border-color:#c4b5fd; }
  .att-select[data-status="غياب"] { background:#fee2e2; color:#b91c1c; border-color:#fca5a5; }
  .att-select[data-status="اوف"] { background:#e2e8f0; color:#334155; border-color:#cbd5e1; }
  .att-select[data-status="زمنية"] { background:#fef3c7; color:#92400e; border-color:#fcd34d; }
  .att-badge { display:inline-block; padding:6px 10px; border-radius:8px; font-size:0.78rem; font-weight:800; min-width:60px; }
  .st-present { background:#dcfce7; color:#16a34a; }
  .st-leave { background:#ede9fe; color:#7c3aed; }
  .st-absent { background:#fee2e2; color:#dc2626; }
  .st-off { background:#e2e8f0; color:#475569; }
  .st-partial { background:#fef3c7; color:#92400e; }
  .st-empty { background:#f8fafc; color:#cbd5e1; }

  .pagination-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:12px 16px; background:#fff; border:1px solid #e2e8f0; border-top:none; border-radius:0 0 14px 14px; font-size:0.78rem; color:#64748b; font-weight:700; }
  .page-btns { display:flex; align-items:center; gap:4px; }
  .page-btn { border:1.5px solid #e2e8f0; background:#fff; border-radius:7px; padding:5px 10px; font-family:inherit; font-size:0.78rem; font-weight:700; color:#334155; cursor:pointer; }
  .page-btn.active { background:#0c1a30; border-color:#0c1a30; color:#fff; }
  .page-btn:disabled { opacity:.4; cursor:default; }
  .page-size-select { padding:5px 8px; border:1.5px solid #e2e8f0; border-radius:7px; font-family:inherit; font-size:0.78rem; color:#334155; }

  .emp-row-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .emp-del-btn { background:none; border:none; color:#dc2626; cursor:pointer; font-size:0.85rem; padding:2px 4px; }

  .add-emp-bar { display:flex; gap:8px; padding:14px; align-items:center; background:#fff; border:1px solid #e2e8f0; border-radius:12px; margin-top:14px; }
  .add-emp-bar input { flex:1; max-width:260px; padding:8px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:0.85rem; }

  .empty-state { text-align:center; padding:40px 20px; color:#94a3b8; font-size:0.9rem; }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(12,26,48,0.55); z-index:9500; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border-radius:16px; padding:22px; width:320px; max-width:90vw; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .modal-box h3 { margin:0 0 14px; font-size:1rem; color:#0c1a30; }
  .modal-box input { width:100%; padding:9px 10px; border:1.5px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:0.9rem; margin-bottom:14px; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="goBack()">→ رجوع لاختيار النظام</button>
  <div class="topbar-title">📋 متابعة الحضور</div>
  <span class="topbar-user" id="headerUserName" style="display:none"></span>
</div>

<div id="loadingOverlay"><div class="spin"></div><div style="color:#64748b;font-size:0.9rem">جارِ التحميل...</div></div>
<div id="noticeBox"></div>

<div class="wrap" id="mainWrap">

  <div class="dept-tabs" id="deptTabs"></div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="toolbar">
    <div class="month-nav">
      <button onclick="shiftDay(-1)">▶ يوم سابق</button>
      <span class="month-range" id="dayLabel"></span>
      <button onclick="shiftDay(1)">يوم تالٍ ◀</button>
      <button onclick="jumpToToday()">اليوم</button>
      <input type="date" id="dayInput" class="day-input" onchange="onDayInputChange()">
    </div>
    <input type="text" id="empSearch" class="emp-search" placeholder="🔍 بحث باسم الموظف..." oninput="onFilterChange()">
    <select id="statusFilter" class="filter-select" onchange="onFilterChange()">
      <option value="">كل الحالات</option>
      <option value="حاضر">حاضر</option>
      <option value="اجازة">اجازة</option>
      <option value="غياب">غياب</option>
      <option value="اوف">اوف</option>
      <option value="زمنية">زمنية</option>
    </select>
    <select id="sortMode" class="filter-select" onchange="onFilterChange()">
      <option value="order">الترتيب الافتراضي</option>
      <option value="name">حسب الاسم</option>
      <option value="status">حسب الحالة</option>
    </select>
    <div class="dept-actions" id="deptActionsBar"></div>
  </div>
  <div class="month-context" id="monthContextLabel"></div>

  <div class="list-card">
    <div class="list-head-row">
      <span></span><span>الموظف</span><span>القسم</span><span>الحالة</span>
    </div>
    <div id="listBody"></div>
  </div>
  <div class="pagination-bar">
    <span id="totalCountLabel">الإجمالي: 0</span>
    <div class="page-btns" id="pageBtns"></div>
    <div>
      لكل صفحة:
      <select id="pageSizeSelect" class="page-size-select" onchange="onPageSizeChange()">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
  </div>

  <div class="add-emp-bar" id="addEmpBar" style="display:none">
    <input type="text" id="newEmpName" placeholder="اسم الموظف الجديد">
    <button class="btn-sm btn-blue" onclick="addEmployee()">+ إضافة موظف</button>
  </div>

</div>

<!-- Add / rename department modal -->
<div class="modal-bg" id="deptModal">
  <div class="modal-box">
    <h3 id="deptModalTitle">قسم جديد</h3>
    <input type="text" id="deptModalInput" placeholder="اسم القسم">
    <div class="modal-btns">
      <button class="btn-sm btn-gray" onclick="closeDeptModal()">إلغاء</button>
      <button class="btn-sm btn-blue" onclick="saveDeptModal()">حفظ</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE — same project as index.html
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyA1q9LiS6EXNCBFmFvytyN-p4KKgP9wym4",
  authDomain: "prime-e-8eb80.firebaseapp.com",
  databaseURL: "https://prime-e-8eb80-default-rtdb.firebaseio.com",
  projectId: "prime-e-8eb80",
  storageBucket: "prime-e-8eb80.firebasestorage.app",
  messagingSenderId: "671376930301",
  appId: "1:671376930301:web:f8b61666314f3149fb5594"
};
firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();
const fbAuth = firebase.auth();

// ═══════════════════════════════════════════════════════════════
// AUTH / PERMISSIONS — resolved fresh here (same pattern as
// admin-dashboard.html), NOT trusted from URL params, since this file
// can be opened directly and Firebase Auth is shared across the
// same-origin iframe session set up by index.html.
// ═══════════════════════════════════════════════════════════════
let myWorkspaceOwner = null;
let isAdmin = false;
let myDisplayName = '';
let myDepartmentAccess = 'none';   // 'none' / 'view' / 'edit' — from systems.departments
let myOwnDepartment = '';          // non-admin managers are scoped to this department only
let canManageDepts = false;        // true owner OR a delegated admin (systems.admin === 'edit') — allowed to create/rename/delete departments and employees

function computeMemberSystems(p) {
  if (p.systems) {
    return {
      matabaa: p.systems.matabaa || 'none', hr: p.systems.hr || 'none', manager: p.systems.manager || 'none',
      accounts: p.systems.accounts || 'none', admin: p.systems.admin || 'none', sales: p.systems.sales || 'none',
      departments: p.systems.departments || 'none',
      selfService: !!p.selfService, employeeName: p.employeeName || ''
    };
  }
  return { matabaa: 'none', hr: 'none', manager: 'none', accounts: 'none', admin: p.isAdmin ? 'edit' : 'none', sales: 'none', departments: 'none', selfService: false, employeeName: '' };
}

function staffMemberRef(uid) { return fbDB.ref('staffMembers/' + myWorkspaceOwner + '/' + uid); }

function showNotice(msg) {
  document.getElementById('loadingOverlay').style.display = 'none';
  const n = document.getElementById('noticeBox');
  n.textContent = msg;
  n.style.display = 'block';
}

fbAuth.onAuthStateChanged(function (user) {
  if (!user) { showNotice('الرجاء تسجيل الدخول من الملف الرئيسي أولاً'); return; }
  fbDB.ref('admins/' + user.uid).once('value').then(adminSnap => {
    if (adminSnap.val() === true) {
      isAdmin = true;
      myWorkspaceOwner = user.uid;
      myDepartmentAccess = 'edit';
      canManageDepts = true;
      myDisplayName = (fbAuth.currentUser && fbAuth.currentUser.displayName) || 'المشرف';
      boot();
      return;
    }
    fbDB.ref('memberIndex/' + user.uid).once('value').then(idxSnap => {
      const owner = idxSnap.val();
      if (!owner) { showNotice('حساب غير مرتبط بمساحة عمل'); return; }
      myWorkspaceOwner = owner;
      staffMemberRef(user.uid).once('value').then(pSnap => {
        const p = pSnap.val() || {};
        const sys = computeMemberSystems(p);
        const isDelegatedAdmin = sys.admin === 'edit';
        if (sys.departments === 'none' && !isDelegatedAdmin) {
          showNotice('🚫 ليس لديك صلاحية الوصول إلى نظام متابعة الأقسام. الرجاء التواصل مع المشرف لمنحك هذه الصلاحية.');
          return;
        }
        canManageDepts = isDelegatedAdmin;
        myDepartmentAccess = isDelegatedAdmin ? 'edit' : sys.departments; // delegated admins get full edit, unscoped
        myOwnDepartment = (p.department || '').trim();
        myDisplayName = p.name || p.phone || '';
        boot();
      });
    });
  }).catch(() => showNotice('تعذّر الاتصال بقاعدة البيانات'));
});

function goBack() {
  if (window.parent && window.parent !== window && typeof window.parent.backToChooserFromDepartments === 'function') {
    window.parent.backToChooserFromDepartments();
  } else {
    history.back();
  }
}

// ═══════════════════════════════════════════════════════════════
// DATA PATHS
// ═══════════════════════════════════════════════════════════════
function rootRef() { return fbDB.ref('departmentsAttendance/' + myWorkspaceOwner); }
function deptsRef() { return rootRef().child('depts'); }
function deptRef(id) { return deptsRef().child(id); }
function recordsRef(deptId, dateStr) { return rootRef().child('records/' + deptId + '/' + dateStr); }

const STATUS_OPTIONS = [
  { value: '', label: '—' },
  { value: 'حاضر', label: 'حاضر' },
  { value: 'اجازة', label: 'اجازة' },
  { value: 'غياب', label: 'غياب' },
  { value: 'اوف', label: 'اوف' },
  { value: 'زمنية', label: 'زمنية' }
];
const STATUS_CLASS = { 'حاضر': 'st-present', 'اجازة': 'st-leave', 'غياب': 'st-absent', 'اوف': 'st-off', 'زمنية': 'st-partial', '': 'st-empty' };

let allDepts = {};       // { deptId: { name, order, employees: {empId:{name,order}} } }
let activeDeptId = null;
let selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
let monthStart = startOfMonth(selectedDate);
let currentRecords = {}; // { dateStr: { empId: status } }
let recordsListenerRef = null;
let currentPage = 1;
let pageSize = 10;

function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function daysInMonth(d) {
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
}
function fmtDateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const WEEKDAY_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTH_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function boot() {
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  const nameEl = document.getElementById('headerUserName');
  if (myDisplayName) { nameEl.textContent = '👤 ' + myDisplayName; nameEl.style.display = ''; }
  renderDeptActionsBar();
  deptsRef().on('value', snap => {
    allDepts = snap.val() || {};
    // Non-admin managers only ever see their own department's tab.
    const visibleIds = Object.keys(allDepts).filter(id => canManageDepts || (allDepts[id].name || '').trim() === myOwnDepartment);
    if (!activeDeptId || !visibleIds.includes(activeDeptId)) {
      activeDeptId = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0))[0] || null;
    }
    renderDeptTabs(visibleIds);
    renderDayLabel();
    attachRecordsListener();
    renderTable();
  });
}

function renderDeptActionsBar() {
  const bar = document.getElementById('deptActionsBar');
  if (!canManageDepts) { bar.innerHTML = ''; return; }
  if (!activeDeptId) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <button class="btn-sm btn-red" onclick="deleteActiveDept()">🗑️ حذف القسم</button>
    <button class="btn-sm btn-gray" onclick="openRenameDeptModal()">✏️ إعادة تسمية</button>
  `;
}

function renderDeptTabs(visibleIds) {
  const wrap = document.getElementById('deptTabs');
  const sorted = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0));
  let html = sorted.map(id => {
    const d = allDepts[id];
    return `<button class="dept-tab ${id === activeDeptId ? 'active' : ''}" onclick="selectDept('${id}')">${escapeHtml(d.name || '')}</button>`;
  }).join('');
  if (canManageDepts) html += `<button class="dept-tab-add" onclick="openNewDeptModal()">+ قسم جديد</button>`;
  wrap.innerHTML = html || '<div class="empty-state" style="padding:6px 0">لا توجد أقسام بعد</div>';
}

function selectDept(id) {
  activeDeptId = id;
  currentPage = 1;
  renderDeptTabs(Object.keys(allDepts).filter(i => canManageDepts || (allDepts[i].name || '').trim() === myOwnDepartment));
  attachRecordsListener();
  renderTable();
}

function shiftDay(dir) {
  selectedDate = new Date(selectedDate.getTime() + dir * 86400000);
  onSelectedDateChanged();
}
function jumpToToday() {
  selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
  onSelectedDateChanged();
}
function onDayInputChange() {
  const val = document.getElementById('dayInput').value; // yyyy-mm-dd
  if (!val) return;
  const [y, m, d] = val.split('-').map(Number);
  selectedDate = new Date(y, m - 1, d);
  onSelectedDateChanged();
}
function onSelectedDateChanged() {
  currentPage = 1;
  const newMonthStart = startOfMonth(selectedDate);
  const monthChanged = newMonthStart.getTime() !== monthStart.getTime();
  monthStart = newMonthStart;
  renderDayLabel();
  if (monthChanged) attachRecordsListener(); else renderTable();
}
function renderDayLabel() {
  document.getElementById('dayLabel').textContent = `${WEEKDAY_AR[selectedDate.getDay()]} ${selectedDate.getDate()}/${selectedDate.getMonth() + 1}/${selectedDate.getFullYear()}`;
  document.getElementById('dayInput').value = fmtDateKey(selectedDate);
  document.getElementById('monthContextLabel').textContent = `بيانات ${MONTH_AR[monthStart.getMonth()]} ${monthStart.getFullYear()} كاملة مستخدمة في الإحصائيات أدناه`;
}

function monthDates() {
  const arr = [];
  const n = daysInMonth(monthStart);
  for (let i = 1; i <= n; i++) arr.push(new Date(monthStart.getFullYear(), monthStart.getMonth(), i));
  return arr;
}

function onFilterChange() {
  currentPage = 1;
  renderTable();
}
function onPageSizeChange() {
  pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10) || 10;
  currentPage = 1;
  renderTable();
}

function attachRecordsListener() {
  if (recordsListenerRef) recordsListenerRef.off();
  currentRecords = {};
  if (!activeDeptId) { renderTable(); return; }
  const dates = monthDates();
  const first = fmtDateKey(dates[0]), last = fmtDateKey(dates[dates.length - 1]);
  recordsListenerRef = rootRef().child('records/' + activeDeptId).orderByKey().startAt(first).endAt(last);
  recordsListenerRef.on('value', snap => {
    currentRecords = snap.val() || {};
    renderTable();
  });
}

function canEditActiveDept() {
  if (myDepartmentAccess !== 'edit') return false;
  if (canManageDepts) return true;
  const d = allDepts[activeDeptId];
  return !!d && (d.name || '').trim() === myOwnDepartment;
}

function renderKPIs() {
  const row = document.getElementById('kpiRow');
  if (!activeDeptId || !allDepts[activeDeptId]) { row.innerHTML = ''; return; }
  const dept = allDepts[activeDeptId];
  const employees = dept.employees || {};
  const total = Object.keys(employees).length;

  // Selected day's snapshot
  const dayKey = fmtDateKey(selectedDate);
  const dayRecords = currentRecords[dayKey] || {};
  let present = 0, absent = 0, leave = 0, off = 0, partial = 0;
  Object.values(dayRecords).forEach(v => {
    if (v === 'حاضر') present++;
    else if (v === 'غياب') absent++;
    else if (v === 'اجازة') leave++;
    else if (v === 'اوف') off++;
    else if (v === 'زمنية') partial++;
  });
  const marked = present + absent + leave + off + partial;
  const notYet = Math.max(total - marked, 0);
  const rate = total ? Math.round((present / total) * 100) : 0;

  const seg = (val, color) => total ? `<div class="bar-seg" style="width:${(val/total*100)}%;background:${color}"></div>` : '';

  // Monthly performance (all days in month) — % of marked slots that are حاضر
  let monthPresent = 0, monthMarked = 0;
  Object.values(currentRecords).forEach(day => {
    Object.values(day || {}).forEach(v => { if (v) { monthMarked++; if (v === 'حاضر') monthPresent++; } });
  });
  const monthRate = monthMarked ? Math.round((monthPresent / monthMarked) * 100) : 0;

  row.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-title">📊 نسبة الحضور — ${WEEKDAY_AR[selectedDate.getDay()]} ${selectedDate.getDate()}/${selectedDate.getMonth()+1}</div>
      <div class="kpi-split"><span class="kpi-big">${rate}%</span></div>
      <div class="kpi-sub">من إجمالي ${total} موظف في هذا القسم</div>
      <div class="bar-track">${seg(present,'#16a34a')}${seg(partial,'#d97706')}${seg(leave,'#7c3aed')}${seg(off,'#64748b')}${seg(absent,'#dc2626')}${seg(notYet,'#e2e8f0')}</div>
      <div class="bar-legend">
        <span class="bar-legend-item"><span class="bar-dot" style="background:#16a34a"></span>حاضر ${present}</span>
        <span class="bar-legend-item"><span class="bar-dot" style="background:#dc2626"></span>غياب ${absent}</span>
        <span class="bar-legend-item"><span class="bar-dot" style="background:#e2e8f0"></span>لم يُسجَّل ${notYet}</span>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">👥 الحاضرون في هذا اليوم</div>
      <div class="kpi-big">${present}<span style="font-size:1rem;color:#94a3b8;font-weight:700">/${total}</span></div>
      <div class="kpi-sub">اجازة ${leave} · اوف ${off} · زمنية ${partial}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">⚡ أداء الشهر</div>
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(#16a34a 0% ${monthRate}%, #e2e8f0 ${monthRate}% 100%)">
          <div class="donut-inner">${monthRate}%</div>
        </div>
        <div class="kpi-sub">نسبة الحضور من إجمالي<br>السجلات المسجّلة هذا الشهر</div>
      </div>
    </div>`;
}

function getFlatRows() {
  const dept = allDepts[activeDeptId] || {};
  const employees = dept.employees || {};
  const searchEl = document.getElementById('empSearch');
  const q = (searchEl && searchEl.value || '').trim();
  const statusFilterEl = document.getElementById('statusFilter');
  const statusFilter = statusFilterEl ? statusFilterEl.value : '';
  const sortModeEl = document.getElementById('sortMode');
  const sortMode = sortModeEl ? sortModeEl.value : 'order';

  let empIds = Object.keys(employees);
  if (q) empIds = empIds.filter(id => (employees[id].name || '').includes(q));

  const dayKey = fmtDateKey(selectedDate);
  const dayRecords = currentRecords[dayKey] || {};
  const deptName = dept.name || '';

  let rows = empIds.map(empId => {
    const emp = employees[empId];
    const status = dayRecords[empId] || '';
    return { empId, name: emp.name || '', order: emp.order || 0, deptName, dateKey: dayKey, status };
  });

  if (statusFilter) rows = rows.filter(r => r.status === statusFilter);

  if (sortMode === 'name') {
    rows.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  } else if (sortMode === 'status') {
    rows.sort((a, b) => (a.status || 'zzz').localeCompare(b.status || 'zzz', 'ar') || a.order - b.order);
  } else {
    rows.sort((a, b) => a.order - b.order);
  }
  return rows;
}

function initials(name) {
  const parts = (name || '').trim().split(/\s+/);
  return (parts[0] ? parts[0][0] : '؟');
}

function renderPagination(totalCount) {
  const totalPages = Math.max(Math.ceil(totalCount / pageSize), 1);
  if (currentPage > totalPages) currentPage = totalPages;
  document.getElementById('totalCountLabel').textContent = `الإجمالي: ${totalCount.toLocaleString('en-US')}`;
  const btnsWrap = document.getElementById('pageBtns');
  let html = `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(1)">«</button>`;
  html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;
  const windowSize = 3;
  let start = Math.max(1, currentPage - windowSize);
  let end = Math.min(totalPages, currentPage + windowSize);
  if (start > 1) html += `<button class="page-btn" onclick="goToPage(1)">1</button>${start > 2 ? '<span>…</span>' : ''}`;
  for (let p = start; p <= end; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
  }
  if (end < totalPages) html += `${end < totalPages - 1 ? '<span>…</span>' : ''}<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button>`;
  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${totalPages})">»</button>`;
  btnsWrap.innerHTML = html;
}

function goToPage(p) {
  currentPage = p;
  renderTable();
}

function renderTable() {
  renderKPIs();
  const listBody = document.getElementById('listBody');
  const addBar = document.getElementById('addEmpBar');

  if (!activeDeptId || !allDepts[activeDeptId]) {
    listBody.innerHTML = '<div class="empty-state">اختر قسمًا أو أنشئ قسمًا جديدًا للبدء</div>';
    addBar.style.display = 'none';
    renderPagination(0);
    return;
  }

  const canEdit = canEditActiveDept();
  const allRows = getFlatRows();
  const totalCount = allRows.length;
  const start = (currentPage - 1) * pageSize;
  const pageRows = allRows.slice(start, start + pageSize);

  listBody.innerHTML = (pageRows.length ? pageRows.map(r => {
    const cls = STATUS_CLASS[r.status] || 'st-empty';
    const statusCell = canEdit
      ? (() => {
          const opts = STATUS_OPTIONS.map(o => `<option value="${o.value}" ${o.value === r.status ? 'selected' : ''}>${o.label}</option>`).join('');
          return `<select class="att-select" data-status="${r.status}" onchange="this.dataset.status=this.value; setStatus('${r.dateKey}','${r.empId}',this.value)">${opts}</select>`;
        })()
      : `<span class="att-badge ${cls}">${r.status || '—'}</span>`;
    return `<div class="list-row">
      <input type="checkbox">
      <div class="emp-name-cell"><span class="emp-avatar">${escapeHtml(initials(r.name))}</span>${escapeHtml(r.name)}</div>
      <div class="date-cell">${escapeHtml(r.deptName)}</div>
      <div class="att-cell">${statusCell}</div>
    </div>`;
  }).join('') : `<div class="empty-state">${totalCount === 0 && (document.getElementById('empSearch').value || document.getElementById('statusFilter').value) ? 'لا توجد نتائج مطابقة' : 'لا يوجد موظفون في هذا القسم بعد'}</div>`);

  renderPagination(totalCount);
  addBar.style.display = canManageDepts ? 'flex' : 'none';
}

function setStatus(dateKey, empId, value) {
  if (!canEditActiveDept()) return;
  const ref = recordsRef(activeDeptId, dateKey).child(empId);
  if (value) ref.set(value); else ref.remove();
}

// ── Employee management (admin only) ────────────────────────────
function addEmployee() {
  if (!canManageDepts || !activeDeptId) return;
  const input = document.getElementById('newEmpName');
  const name = input.value.trim();
  if (!name) return;
  const empId = deptRef(activeDeptId).child('employees').push().key;
  const dept = allDepts[activeDeptId] || {};
  const count = Object.keys(dept.employees || {}).length;
  deptRef(activeDeptId).child('employees/' + empId).set({ name, order: count }).then(() => {
    input.value = '';
  });
}
function removeEmployee(empId) {
  if (!canManageDepts || !activeDeptId) return;
  if (!confirm('حذف هذا الموظف من القسم؟ (سجل حضوره السابق سيبقى محفوظًا)')) return;
  deptRef(activeDeptId).child('employees/' + empId).remove();
}

// ── Department management (admin only) ──────────────────────────
let deptModalMode = 'new'; // 'new' | 'rename'
function openNewDeptModal() {
  deptModalMode = 'new';
  document.getElementById('deptModalTitle').textContent = 'قسم جديد';
  document.getElementById('deptModalInput').value = '';
  document.getElementById('deptModal').style.display = 'flex';
}
function openRenameDeptModal() {
  if (!activeDeptId) return;
  deptModalMode = 'rename';
  document.getElementById('deptModalTitle').textContent = 'إعادة تسمية القسم';
  document.getElementById('deptModalInput').value = allDepts[activeDeptId].name || '';
  document.getElementById('deptModal').style.display = 'flex';
}
function closeDeptModal() { document.getElementById('deptModal').style.display = 'none'; }
function saveDeptModal() {
  const name = document.getElementById('deptModalInput').value.trim();
  if (!name) return;
  if (deptModalMode === 'new') {
    const id = deptsRef().push().key;
    const count = Object.keys(allDepts).length;
    deptsRef().child(id).set({ name, order: count, employees: {} }).then(() => { activeDeptId = id; closeDeptModal(); });
  } else {
    deptRef(activeDeptId).child('name').set(name).then(closeDeptModal);
  }
}
function deleteActiveDept() {
  if (!canManageDepts || !activeDeptId) return;
  const name = (allDepts[activeDeptId] || {}).name || '';
  if (!confirm(`حذف قسم "${name}" بكل موظفيه وسجل حضوره؟ لا يمكن التراجع عن هذا.`)) return;
  const id = activeDeptId;
  deptRef(id).remove();
  rootRef().child('records/' + id).remove();
  activeDeptId = null;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
