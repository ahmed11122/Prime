<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE — same project as index.html
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyA1q9LiS6EXNCBFmFvytyN-p4KKgP9wym4",
  authDomain: "prime-e-8eb80.firebaseapp.com",
  databaseURL: "https://prime-e-8eb80-default-rtdb.firebaseio.com",
  projectId: "prime-e-8eb80",
  storageBucket: "prime-e-8eb80.firebasestorage.app",
  messagingSenderId: "671376930301",
  appId: "1:671376930301:web:f8b61666314f3149fb5594"
};
firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();
const fbAuth = firebase.auth();

// ═══════════════════════════════════════════════════════════════
// AUTH / PERMISSIONS — resolved fresh here (same pattern as
// admin-dashboard.html), NOT trusted from URL params, since this file
// can be opened directly and Firebase Auth is shared across the
// same-origin iframe session set up by index.html.
// ═══════════════════════════════════════════════════════════════
let myWorkspaceOwner = null;
let isAdmin = false;
let myDisplayName = '';
let myDepartmentAccess = 'none';   // 'none' / 'view' / 'edit' — from systems.departments
let myOwnDepartment = '';          // non-admin managers are scoped to this department only
let canManageDepts = false;        // true owner OR a delegated admin (systems.admin === 'edit') — full admin, plus can CREATE new departments (not scoped to one dept)
let seesAllDepts = false;          // true for owner/delegated admin OR a member granted "كل الأقسام" — sees/edits every department, not just their own
let canManageEmployees = false;    // true for canManageDepts OR a member granted "full"/"full-all" (كاملة، إضافة وحذف) — allowed to add/remove employees AND rename/delete the department(s) within their scope, without becoming a full admin (can't create brand-new departments unless also seesAllDepts)

function computeMemberSystems(p) {
  if (p.systems) {
    return {
      matabaa: p.systems.matabaa || 'none', hr: p.systems.hr || 'none', manager: p.systems.manager || 'none',
      accounts: p.systems.accounts || 'none', admin: p.systems.admin || 'none', sales: p.systems.sales || 'none',
      departments: p.systems.departments || 'none',
      selfService: !!p.selfService, employeeName: p.employeeName || ''
    };
  }
  return { matabaa: 'none', hr: 'none', manager: 'none', accounts: 'none', admin: p.isAdmin ? 'edit' : 'none', sales: 'none', departments: 'none', selfService: false, employeeName: '' };
}

function staffMemberRef(uid) { return fbDB.ref('staffMembers/' + myWorkspaceOwner + '/' + uid); }

function showNotice(msg) {
  document.getElementById('loadingOverlay').style.display = 'none';
  const n = document.getElementById('noticeBox');
  n.textContent = msg;
  n.style.display = 'block';
}

fbAuth.onAuthStateChanged(function (user) {
  if (!user) { showNotice('الرجاء تسجيل الدخول من الملف الرئيسي أولاً'); return; }
  fbDB.ref('admins/' + user.uid).once('value').then(adminSnap => {
    if (adminSnap.val() === true) {
      isAdmin = true;
      myWorkspaceOwner = user.uid;
      myDepartmentAccess = 'edit';
      canManageDepts = true;
      seesAllDepts = true;
      canManageEmployees = true;
      myDisplayName = (fbAuth.currentUser && fbAuth.currentUser.displayName) || 'المشرف';
      boot();
      return;
    }
    fbDB.ref('memberIndex/' + user.uid).once('value').then(idxSnap => {
      const owner = idxSnap.val();
      if (!owner) { showNotice('حساب غير مرتبط بمساحة عمل'); return; }
      myWorkspaceOwner = owner;
      staffMemberRef(user.uid).once('value').then(pSnap => {
        const p = pSnap.val() || {};
        const sys = computeMemberSystems(p);
        const isDelegatedAdmin = sys.admin === 'edit';
        if (sys.departments === 'none' && !isDelegatedAdmin) {
          showNotice('🚫 ليس لديك صلاحية الوصول إلى نظام متابعة الأقسام. الرجاء التواصل مع المشرف لمنحك هذه الصلاحية.');
          return;
        }
        canManageDepts = isDelegatedAdmin;
        // 'edit-all' / 'view-all' / 'full-all' = full access to every department
        // (not just their own), granted from the admin panel, without giving
        // them the full لوحة المشرف admin panel access that isDelegatedAdmin implies.
        const fullAccessGrant = sys.departments === 'edit-all' || sys.departments === 'view-all' || sys.departments === 'full-all';
        seesAllDepts = isDelegatedAdmin || fullAccessGrant;
        // 'full' / 'full-all' = كاملة، إضافة وحذف — lets a member add/rename/
        // delete EMPLOYEES within their scope (own dept, or every dept for
        // -all), without granting department-level CRUD (canManageDepts stays
        // reserved for real delegated admins) and without making them a
        // general admin.
        const isFullGrant = sys.departments === 'full' || sys.departments === 'full-all';
        canManageEmployees = isDelegatedAdmin || isFullGrant;
        myDepartmentAccess = isDelegatedAdmin
          ? 'edit'
          : (sys.departments === 'edit-all' || sys.departments === 'full-all' ? 'edit'
            : (sys.departments === 'view-all' ? 'view'
            : (sys.departments === 'full' ? 'edit' : sys.departments)));
        myOwnDepartment = (p.department || '').trim();
        myDisplayName = p.name || p.phone || '';
        boot();
      });
    });
  }).catch(() => showNotice('تعذّر الاتصال بقاعدة البيانات'));
});

function goBack() {
  if (window.parent && window.parent !== window && typeof window.parent.backToChooserFromDepartments === 'function') {
    window.parent.backToChooserFromDepartments();
  } else {
    history.back();
  }
}

// ═══════════════════════════════════════════════════════════════
// DATA PATHS
// ═══════════════════════════════════════════════════════════════
function rootRef() { return fbDB.ref('departmentsAttendance/' + myWorkspaceOwner); }
function deptsRef() { return rootRef().child('depts'); }
function deptRef(id) { return deptsRef().child(id); }
function recordsRef(deptId, dateStr) { return rootRef().child('records/' + deptId + '/' + dateStr); }

const STATUS_OPTIONS = [
  { value: '', label: '—' },
  { value: 'حاضر', label: 'حاضر' },
  { value: 'اجازة', label: 'اجازة' },
  { value: 'مرضية', label: 'مرضية' },
  { value: 'غياب', label: 'غياب' },
  { value: 'اوف', label: 'اوف' },
  { value: 'زمنية', label: 'زمنية' }
];
const STATUS_CLASS = { 'حاضر': 'st-present', 'اجازة': 'st-leave', 'مرضية': 'st-sick', 'غياب': 'st-absent', 'اوف': 'st-off', 'زمنية': 'st-partial', '': 'st-empty' };
// Records can be a legacy plain status string, or an object { status, checkIn, checkOut }
// left in place for backward compatibility with any records already saved that way.
function recStatus(v) { if (v == null) return ''; return (typeof v === 'object') ? (v.status || '') : v; }

let allDepts = {};       // { deptId: { name, order, employees: {empId:{name,order}} } }
let activeDeptId = null;
let selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
let monthStart = startOfMonth(selectedDate);
let currentRecords = {}; // { dateStr: { empId: status } }
let recordsListenerRef = null;
let currentPage = 1;
let pageSize = 10;

function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function daysInMonth(d) {
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
}
function fmtDateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const WEEKDAY_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const WEEKDAY_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTH_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function boot() {
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  const nameEl = document.getElementById('headerUserName');
  if (myDisplayName) { nameEl.textContent = '👤 ' + myDisplayName; nameEl.style.display = ''; }
  renderDeptActionsBar();
  deptsRef().on('value', snap => {
    allDepts = snap.val() || {};
    // Non-admin managers only ever see their own department's tab.
    const visibleIds = Object.keys(allDepts).filter(id => canManageDepts || seesAllDepts || (allDepts[id].name || '').trim() === myOwnDepartment);
    if (!activeDeptId || !visibleIds.includes(activeDeptId)) {
      activeDeptId = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0))[0] || null;
    }
    renderDeptTabs(visibleIds);
    renderDeptActionsBar();
    renderDayLabel();
    attachRecordsListener();
    renderTable();
  });
  // Keep a live cache of the leave-cards system's employees so اجازة / زمنية /
  // غياب marks made here can be mirrored over there (see setDayStatus below).
  fbDB.ref('leaveCardsSystem/' + myWorkspaceOwner + '/employees').on('value', snap => {
    leaveEmployeesCache = snap.val() || [];
  });
}

function renderDeptActionsBar() {
  const bar = document.getElementById('deptActionsBar');
  if (!canManageEmpActiveDept()) { bar.innerHTML = ''; return; }
  if (!activeDeptId) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <button class="btn-sm btn-red" onclick="deleteActiveDept()">🗑️ حذف القسم</button>
    <button class="btn-sm btn-gray" onclick="openRenameDeptModal()">✏️ إعادة تسمية</button>
  `;
}

function renderDeptTabs(visibleIds) {
  const wrap = document.getElementById('deptTabs');
  const sorted = visibleIds.sort((a, b) => (allDepts[a].order || 0) - (allDepts[b].order || 0));
  let html = sorted.map(id => {
    const d = allDepts[id];
    return `<button class="dept-tab ${id === activeDeptId ? 'active' : ''}" onclick="selectDept('${id}')">${escapeHtml(d.name || '')}</button>`;
  }).join('');
  if (canManageDepts || (canManageEmployees && seesAllDepts)) html += `<button class="dept-tab-add" onclick="openNewDeptModal()">+ قسم جديد</button>`;
  wrap.innerHTML = html || '<div class="empty-state" style="padding:6px 0">لا توجد أقسام بعد</div>';
}

function selectDept(id) {
  activeDeptId = id;
  currentPage = 1;
  renderDeptTabs(Object.keys(allDepts).filter(i => canManageDepts || seesAllDepts || (allDepts[i].name || '').trim() === myOwnDepartment));
  renderDeptActionsBar();
  attachRecordsListener();
  renderTable();
}

function shiftMonth(dir) {
  monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() + dir, 1);
  currentPage = 1;
  renderDayLabel();
  attachRecordsListener();
}
function jumpToToday() {
  const t = new Date(); t.setHours(0,0,0,0);
  selectedDate = t;
  const newMonthStart = startOfMonth(t);
  const monthChanged = newMonthStart.getTime() !== monthStart.getTime();
  monthStart = newMonthStart;
  currentPage = 1;
  renderDayLabel();
  if (monthChanged) attachRecordsListener(); else renderTable();
  // scroll today's column into view
  setTimeout(() => {
    const el = document.querySelector('.att-grid .today-col');
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest' });
  }, 50);
}
function renderDayLabel() {
  document.getElementById('dayLabel').textContent = `${MONTH_AR[monthStart.getMonth()]} ${monthStart.getFullYear()}`;
  renderLegend();
}
function renderLegend() {
  const items = [
    { cls: 'st-present', label: 'حاضر' },
    { cls: 'st-absent', label: 'غياب' },
    { cls: 'st-leave', label: 'اجازة' },
    { cls: 'st-sick', label: 'مرضية' },
    { cls: 'st-off', label: 'اوف' },
    { cls: 'st-partial', label: 'زمنية' },
    { cls: 'st-empty', label: 'لم يُسجَّل' }
  ];
  const colorOf = { 'st-present': '#16a34a', 'st-absent': '#dc2626', 'st-leave': '#7c3aed', 'st-sick': '#e11d48', 'st-off': '#94a3b8', 'st-partial': '#d97706', 'st-empty': '#cbd5e1' };
  document.getElementById('legendRow').innerHTML = items.map(i =>
    `<span class="legend-item"><span class="legend-dot" style="background:${colorOf[i.cls]}"></span>${i.label}</span>`
  ).join('');
}

function monthDates() {
  const arr = [];
  const n = daysInMonth(monthStart);
  for (let i = 1; i <= n; i++) arr.push(new Date(monthStart.getFullYear(), monthStart.getMonth(), i));
  return arr;
}

function onFilterChange() {
  currentPage = 1;
  renderTable();
}
function onPageSizeChange() {
  pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10) || 10;
  currentPage = 1;
  renderTable();
}

function attachRecordsListener() {
  if (recordsListenerRef) recordsListenerRef.off();
  currentRecords = {};
  if (!activeDeptId) { renderTable(); return; }
  const dates = monthDates();
  const first = fmtDateKey(dates[0]), last = fmtDateKey(dates[dates.length - 1]);
  recordsListenerRef = rootRef().child('records/' + activeDeptId).orderByKey().startAt(first).endAt(last);
  recordsListenerRef.on('value', snap => {
    currentRecords = snap.val() || {};
    renderTable();
  });
}

function canEditActiveDept() {
  if (myDepartmentAccess !== 'edit') return false;
  if (canManageDepts || seesAllDepts) return true;
  const d = allDepts[activeDeptId];
  return !!d && (d.name || '').trim() === myOwnDepartment;
}

// Employee AND department (rename/delete, not create) permission for the
// active department. A "full"/"full-all" grant unlocks this without giving
// full admin rights (creating brand-new departments still needs canManageDepts
// or seesAllDepts — see the dept-tab-add / openNewDeptModal checks).
function canManageEmpActiveDept() {
  if (canManageDepts) return true;
  if (!canManageEmployees) return false;
  if (seesAllDepts) return true;
  const d = allDepts[activeDeptId];
  return !!d && (d.name || '').trim() === myOwnDepartment;
}

function renderKPIs() {
  const row = document.getElementById('kpiRow');
  if (!activeDeptId || !allDepts[activeDeptId]) { row.innerHTML = ''; return; }
  const dept = allDepts[activeDeptId];
  const employees = dept.employees || {};
  const total = Object.keys(employees).length;

  // Snapshot for "today" if the currently displayed month contains it, otherwise the last day of the month
  const now = new Date(); now.setHours(0,0,0,0);
  const kpiDate = (now.getFullYear() === monthStart.getFullYear() && now.getMonth() === monthStart.getMonth())
    ? now
    : new Date(monthStart.getFullYear(), monthStart.getMonth(), daysInMonth(monthStart));
  const dayKey = fmtDateKey(kpiDate);
  const dayRecords = currentRecords[dayKey] || {};
  let present = 0, absent = 0, leave = 0, sick = 0, off = 0, partial = 0;
  Object.values(dayRecords).forEach(raw => {
    const v = recStatus(raw);
    if (v === 'حاضر') present++;
    else if (v === 'غياب') absent++;
    else if (v === 'اجازة') leave++;
    else if (v === 'مرضية') sick++;
    else if (v === 'اوف') off++;
    else if (v === 'زمنية') partial++;
  });
  const marked = present + absent + leave + sick + off + partial;
  const notYet = Math.max(total - marked, 0);
  const rate = total ? Math.round((present / total) * 100) : 0;

  const seg = (val, color) => total ? `<div class="bar-seg" style="width:${(val/total*100)}%;background:${color}"></div>` : '';

  // Monthly performance (all days in month) — % of marked slots that are حاضر
  let monthPresent = 0, monthMarked = 0;
  Object.values(currentRecords).forEach(day => {
    Object.values(day || {}).forEach(raw => { const v = recStatus(raw); if (v) { monthMarked++; if (v === 'حاضر') monthPresent++; } });
  });
  const monthRate = monthMarked ? Math.round((monthPresent / monthMarked) * 100) : 0;

  row.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-title">📊 نسبة الحضور — ${WEEKDAY_AR[kpiDate.getDay()]} ${kpiDate.getDate()}/${kpiDate.getMonth()+1}</div>
      <div class="kpi-split"><span class="kpi-big">${rate}%</span></div>
      <div class="kpi-sub">من إجمالي ${total} موظف في هذا القسم</div>
      <div class="bar-track">${seg(present,'#16a34a')}${seg(partial,'#d97706')}${seg(leave,'#7c3aed')}${seg(sick,'#e11d48')}${seg(off,'#64748b')}${seg(absent,'#dc2626')}${seg(notYet,'#e2e8f0')}</div>
      <div class="bar-legend">
        <span class="bar-legend-item"><span class="bar-dot" style="background:#16a34a"></span>حاضر ${present}</span>
        <span class="bar-legend-item"><span class="bar-dot" style="background:#dc2626"></span>غياب ${absent}</span>
        <span class="bar-legend-item"><span class="bar-dot" style="background:#e2e8f0"></span>لم يُسجَّل ${notYet}</span>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">👥 الحاضرون في هذا اليوم</div>
      <div class="kpi-big">${present}<span style="font-size:1rem;color:#94a3b8;font-weight:700">/${total}</span></div>
      <div class="kpi-sub">اجازة ${leave} · مرضية ${sick} · اوف ${off} · زمنية ${partial}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">⚡ أداء الشهر</div>
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(#16a34a 0% ${monthRate}%, #e2e8f0 ${monthRate}% 100%)">
          <div class="donut-inner">${monthRate}%</div>
        </div>
        <div class="kpi-sub">نسبة الحضور من إجمالي<br>السجلات المسجّلة هذا الشهر</div>
      </div>
    </div>`;
}

function getEmployeeRows() {
  // Returns one row per employee (each row carries every day of the currently
  // displayed month so the grid can be rendered horizontally).
  const dept = allDepts[activeDeptId] || {};
  const employees = dept.employees || {};
  const searchEl = document.getElementById('empSearch');
  const q = (searchEl && searchEl.value || '').trim();
  const statusFilterEl = document.getElementById('statusFilter');
  const statusFilter = statusFilterEl ? statusFilterEl.value : '';
  const sortModeEl = document.getElementById('sortMode');
  const sortMode = sortModeEl ? sortModeEl.value : 'order';

  let empIds = Object.keys(employees);
  if (q) empIds = empIds.filter(id => (employees[id].name || '').includes(q));

  let rows = empIds.map(empId => {
    const emp = employees[empId];
    return { empId, name: emp.name || '', order: emp.order || 0 };
  });

  // Status filter: keep employees who have that status on at least one day this month
  if (statusFilter) {
    rows = rows.filter(r => Object.values(currentRecords).some(day => recStatus((day || {})[r.empId]) === statusFilter));
  }

  if (sortMode === 'name') {
    rows.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  } else {
    rows.sort((a, b) => a.order - b.order);
  }
  return rows;
}

function initials(name) {
  const parts = (name || '').trim().split(/\s+/);
  return (parts[0] ? parts[0][0] : '؟');
}

function renderPagination(totalCount) {
  const totalPages = Math.max(Math.ceil(totalCount / pageSize), 1);
  if (currentPage > totalPages) currentPage = totalPages;
  document.getElementById('totalCountLabel').textContent = `الإجمالي: ${totalCount.toLocaleString('en-US')}`;
  const btnsWrap = document.getElementById('pageBtns');
  let html = `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(1)">«</button>`;
  html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;
  const windowSize = 3;
  let start = Math.max(1, currentPage - windowSize);
  let end = Math.min(totalPages, currentPage + windowSize);
  if (start > 1) html += `<button class="page-btn" onclick="goToPage(1)">1</button>${start > 2 ? '<span>…</span>' : ''}`;
  for (let p = start; p <= end; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
  }
  if (end < totalPages) html += `${end < totalPages - 1 ? '<span>…</span>' : ''}<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button>`;
  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${totalPages})">»</button>`;
  btnsWrap.innerHTML = html;
}

function goToPage(p) {
  currentPage = p;
  renderTable();
}

function renderTable() {
  renderKPIs();
  const grid = document.getElementById('attGrid');
  const addBar = document.getElementById('addEmpBar');

  if (!activeDeptId || !allDepts[activeDeptId]) {
    grid.innerHTML = '';
    document.querySelector('.att-grid-wrap').innerHTML = '<table class="att-grid" id="attGrid"></table><div class="empty-state">اختر قسمًا أو أنشئ قسمًا جديدًا للبدء</div>';
    addBar.style.display = 'none';
    renderPagination(0);
    return;
  }

  const canEdit = canEditActiveDept();
  const allRows = getEmployeeRows();
  const totalCount = allRows.length;
  const start = (currentPage - 1) * pageSize;
  const pageRows = allRows.slice(start, start + pageSize);
  const dates = monthDates();
  const todayKey = fmtDateKey(new Date());

  if (!pageRows.length) {
    const msg = (totalCount === 0 && (document.getElementById('empSearch').value || document.getElementById('statusFilter').value))
      ? 'لا توجد نتائج مطابقة' : 'لا يوجد موظفون في هذا القسم بعد';
    grid.innerHTML = `<tr><td class="empty-state">${msg}</td></tr>`;
    renderPagination(totalCount);
    addBar.style.display = canManageEmpActiveDept() ? 'flex' : 'none';
    return;
  }

  // Header row: sticky name column + one column per day of the month
  let head = '<thead><tr><th class="name-col">الموظف</th>';
  dates.forEach(d => {
    const key = fmtDateKey(d);
    const isToday = key === todayKey;
    const isWeekend = d.getDay() === 5 || d.getDay() === 6; // Friday / Saturday
    const cls = [isToday ? 'today-col' : '', isWeekend ? 'weekend-col' : ''].filter(Boolean).join(' ');
    head += `<th class="${cls}">${d.getDate()}<span class="wd">${WEEKDAY_EN[d.getDay()]}</span></th>`;
  });
  head += '</tr></thead>';

  // Body rows: one per employee, one cell per day
  let body = '<tbody>';
  pageRows.forEach(r => {
    const nameTools = canManageEmpActiveDept()
      ? `<div class="emp-name-tools">
          <button type="button" class="emp-tool-btn" title="تعيين حاضر لكل الأيام الفارغة هذا الشهر" onclick="markAllPresent('${r.empId}','${escapeHtml(r.name).replace(/'/g, "\\'")}')">✅</button>
          <button type="button" class="emp-tool-btn" title="تعديل الاسم" onclick="renameEmployee('${r.empId}','${escapeHtml(r.name).replace(/'/g, "\\'")}')">✏️</button>
          <button type="button" class="emp-tool-btn emp-tool-del" title="حذف الموظف" onclick="removeEmployee('${r.empId}')">✕</button>
        </div>`
      : '';
    body += `<tr><td class="name-col"><div class="emp-name-cell"><span class="emp-avatar">${escapeHtml(initials(r.name))}</span><span class="emp-name-text">${escapeHtml(r.name)}</span>${nameTools}</div></td>`;
    dates.forEach(d => {
      const key = fmtDateKey(d);
      const raw = (currentRecords[key] || {})[r.empId];
      const status = recStatus(raw);
      const cls = STATUS_CLASS[status] || 'st-empty';
      const isToday = key === todayKey;
      const isWeekend = d.getDay() === 5 || d.getDay() === 6;
      const tdCls = [isToday ? 'today-col' : '', isWeekend ? 'weekend-col' : ''].filter(Boolean).join(' ');
      let cellInner;
      if (canEdit) {
        const opts = STATUS_OPTIONS.map(o => `<option value="${o.value}" ${o.value === status ? 'selected' : ''}>${o.label}</option>`).join('');
        cellInner = `<select class="day-select" data-status="${status}" onchange="this.dataset.status=this.value; setDayStatus('${r.empId}','${key}',this.value)">${opts}</select>`;
      } else {
        cellInner = `<span class="day-badge ${cls}">${status || '—'}</span>`;
      }
      body += `<td class="day-cell ${tdCls}">${cellInner}</td>`;
    });
    body += '</tr>';
  });
  body += '</tbody>';

  grid.innerHTML = head + body;
  renderPagination(totalCount);
  addBar.style.display = canManageEmpActiveDept() ? 'flex' : 'none';
}

function setDayStatus(empId, dateKey, value) {
  if (!canEditActiveDept()) return;
  const ref = recordsRef(activeDeptId, dateKey).child(empId);
  if (value) ref.set(value); else ref.remove();

  const empName = (((allDepts[activeDeptId] || {}).employees || {})[empId] || {}).name || '';
  syncAttendanceStatusToLeave(empName, activeDeptId, empId, dateKey, value);
}

// Fills every currently-empty day this month with "حاضر" for one employee,
// so admins can bulk-mark a normal month and only touch the exceptions
// (leave, absence, off days) by hand afterwards. Days that already have a
// status (leave, absence, etc.) are left untouched — this never overwrites
// existing entries.
function markAllPresent(empId, empName) {
  if (!canEditActiveDept()) return;
  if (!confirm(`تعيين "حاضر" لكل الأيام الفارغة في هذا الشهر للموظف "${empName}"؟ (الأيام التي تحتوي على حالة مسجّلة مسبقًا لن تتغيّر)`)) return;
  const dates = monthDates();
  dates.forEach(d => {
    const key = fmtDateKey(d);
    const raw = (currentRecords[key] || {})[empId];
    const status = recStatus(raw);
    if (!status) setDayStatus(empId, key, 'حاضر');
  });
  renderTable();
}

// ═══════════════════════════════════════════════════════════════
// SYNC WITH نظام الإجازات والزمنيات (leave-system-*.html)
// Only اجازة / زمنية / غياب are mirrored — nothing else. Employees are
// matched by name between the two systems. Every synced leave-system
// record is tagged with a stable syncId (ATT_<deptId>_<empId>_<date>)
// so re-saving the same day updates the same record instead of
// duplicating it, and so the leave-system side knows not to try to
// mirror this record back to us (see leave-system's own sync code).
// ═══════════════════════════════════════════════════════════════
let leaveEmployeesCache = [];
const ATT_TO_LEAVE_TYPE = { 'اجازة': 'اعتيادية', 'مرضية': 'مرضية', 'زمنية': 'زمنية', 'غياب': 'غياب' };

function normName(s) { return (s || '').trim().replace(/\s+/g, ' '); }

function findLeaveEmployeeIndex(name) {
  const n = normName(name);
  if (!n) return -1;
  return (leaveEmployeesCache || []).findIndex(e => normName(e && e.name) === n);
}

function syncAttendanceStatusToLeave(empName, deptId, empId, dateKey, status) {
  const idx = findLeaveEmployeeIndex(empName);
  if (idx === -1) return; // no matching employee in the leave system — nothing to mirror

  const syncId = 'ATT_' + deptId + '_' + empId + '_' + dateKey;
  const recordsPath = 'leaveCardsSystem/' + myWorkspaceOwner + '/employees/' + idx + '/records';

  fbDB.ref(recordsPath).once('value').then(snap => {
    let records = snap.val() || [];
    if (!Array.isArray(records)) records = Object.values(records);
    // Drop any previous record we created for this exact day (avoids duplicates on update/clear)
    records = records.filter(r => r && r.syncId !== syncId);

    const leaveType = ATT_TO_LEAVE_TYPE[status];
    if (leaveType) {
      records.push({
        t: String(records.length + 1),
        syncId: syncId,
        leaveType: leaveType,
        reqDate: dateKey,
        duration: leaveType === 'زمنية' ? 'محدد من متابعة الحضور' : 'يوم واحد',
        days: leaveType === 'زمنية' ? null : 1,
        from: dateKey, to: dateKey,
        empSig: '', directApproval: '', managerApproval: '',
        substitute: '', timeDate: '', timeHour: '',
        remaining: ''
      });
    }
    records.forEach((r, i) => { r.t = String(i + 1); });
    fbDB.ref(recordsPath).set(records);
  });
}

// ── Employee management (admin, OR a member granted "كاملة، إضافة وحذف") ──
function addEmployee() {
  if (!canManageEmpActiveDept() || !activeDeptId) return;
  const input = document.getElementById('newEmpName');
  const name = input.value.trim();
  if (!name) return;
  const empId = deptRef(activeDeptId).child('employees').push().key;
  const dept = allDepts[activeDeptId] || {};
  const count = Object.keys(dept.employees || {}).length;
  deptRef(activeDeptId).child('employees/' + empId).set({ name, order: count }).then(() => {
    input.value = '';
  });
}
function removeEmployee(empId) {
  if (!canManageEmpActiveDept() || !activeDeptId) return;
  if (!confirm('حذف هذا الموظف من القسم؟ (سجل حضوره السابق سيبقى محفوظًا)')) return;
  deptRef(activeDeptId).child('employees/' + empId).remove();
}
function renameEmployee(empId, currentName) {
  if (!canManageEmpActiveDept() || !activeDeptId) return;
  const name = prompt('اسم الموظف:', currentName || '');
  if (name === null) return; // cancelled
  const trimmed = name.trim();
  if (!trimmed) return;
  deptRef(activeDeptId).child('employees/' + empId + '/name').set(trimmed);
}

// ── Department management (admin, OR a member granted "كاملة، إضافة وحذف") ──
let deptModalMode = 'new'; // 'new' | 'rename'
function openNewDeptModal() {
  if (!canManageDepts && !(canManageEmployees && seesAllDepts)) return;
  deptModalMode = 'new';
  document.getElementById('deptModalTitle').textContent = 'قسم جديد';
  document.getElementById('deptModalInput').value = '';
  document.getElementById('deptModal').style.display = 'flex';
}
function openRenameDeptModal() {
  if (!canManageEmpActiveDept() || !activeDeptId) return;
  deptModalMode = 'rename';
  document.getElementById('deptModalTitle').textContent = 'إعادة تسمية القسم';
  document.getElementById('deptModalInput').value = allDepts[activeDeptId].name || '';
  document.getElementById('deptModal').style.display = 'flex';
}
function closeDeptModal() { document.getElementById('deptModal').style.display = 'none'; }
function saveDeptModal() {
  const name = document.getElementById('deptModalInput').value.trim();
  if (!name) return;
  if (deptModalMode === 'new') {
    if (!canManageDepts && !(canManageEmployees && seesAllDepts)) return;
    const id = deptsRef().push().key;
    const count = Object.keys(allDepts).length;
    deptsRef().child(id).set({ name, order: count, employees: {} }).then(() => { activeDeptId = id; closeDeptModal(); });
  } else {
    if (!canManageEmpActiveDept() || !activeDeptId) return;
    deptRef(activeDeptId).child('name').set(name).then(closeDeptModal);
  }
}
function deleteActiveDept() {
  if (!canManageEmpActiveDept() || !activeDeptId) return;
  const name = (allDepts[activeDeptId] || {}).name || '';
  if (!confirm(`حذف قسم "${name}" بكل موظفيه وسجل حضوره؟ لا يمكن التراجع عن هذا.`)) return;
  const id = activeDeptId;
  deptRef(id).remove();
  rootRef().child('records/' + id).remove();
  activeDeptId = null;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
